<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>링크번호 소통정보 맞춰 보기</title>
<style>
  body { font-family: -apple-system, 'Malgun Gothic', sans-serif; margin: 0; padding: 16px; background: #0f172a; color: #e2e8f0; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  input, button { font-size: 16px; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; width: 100%; box-sizing: border-box; margin-top: 8px; }
  button { background: #2563eb; border: 0; font-weight: 700; }
  #msg { margin: 12px 0; font-size: 13px; color: #fbbf24; white-space: pre-wrap; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  td, th { padding: 5px 4px; border-bottom: 1px solid #1e293b; text-align: left; vertical-align: top; }
  td.n { text-align: right; white-space: nowrap; }
  tr.ok td.s { color: #4ade80; } tr.part td.s { color: #fbbf24; } tr.no td.s { color: #f87171; } tr.skip td { color: #64748b; }
  .box { background: #1e293b; border-radius: 10px; padding: 12px; margin-bottom: 12px; font-size: 13px; color: #94a3b8; }
  .sub { color: #94a3b8; font-size: 12px; }
</style>
</head>
<body>
<h1>🚦 링크번호 ↔ 국토부 소통정보 맞춰 보기 (시험)</h1>
<div class="box">
  우리 노선 링크번호(data/route/노선_links.json)가 국토교통부 소통정보의 링크번호(linkId)에 얼마나 들어 있는지 확인합니다. 아무것도 저장하지 않습니다.
  <input id="nm" placeholder="이름 (서버로 받을 때, 로그인이 안 되어 있으면 입력)">
  <input id="pn" placeholder="기사번호 6자리" inputmode="numeric">
  <input id="ik" placeholder="(서버·저장파일이 안 되면) 국토교통부 ITS 키 붙여넣기. 저장하지 않음">
</div>
<button id="go">소통정보 불러와서 모든 노선 맞춰 보기</button>
<button id="rng" style="background:#7c3aed;">범위 시험 (전국이 아니게 받는 방법 찾기)</button>
<div id="msg"></div>
<div id="out"></div>
<script src="js/app-config.js"></script>
<script src="js/gas-polyfill.js"></script>
<script>
var msg = document.getElementById('msg'), out = document.getElementById('out');
function norm(s) { return String(s || '').replace(/\s+/g, '').replace(/\(.*?\)/g, ''); }

async function loadTraffic() {
  var tried = [];
  var nm = document.getElementById('nm').value.trim(), pn = document.getElementById('pn').value.trim();
  if (nm && pn) { try { localStorage.setItem('loggedInUser', nm); localStorage.setItem('autoLoginPin', pn); } catch (e) { } }
  try {   // 1) 서버(앱스크립트)
    var r = await fetch(window.GAS_WEB_APP_URL + '?action=get_traffic_flow').then(function (x) { return x.json(); });
    if (r && r.items && r.items.length) return { items: r.items, from: '서버' };
    tried.push('서버: ' + (r && r.error ? r.error : '자료 없음'));
  } catch (e) { tried.push('서버 실패'); }
  try {   // 2) GitHub에 저장된 소통정보
    var j = await fetch('data/traffic.json?t=' + Date.now()).then(function (x) { if (!x.ok) throw new Error(x.status); return x.json(); });
    if (j && j.flow && j.flow.length) return { items: j.flow, from: '저장된 파일(' + j.updated + ')' };
    tried.push('저장 파일: 소통 자료 없음');
  } catch (e) { tried.push('저장 파일 없음'); }
  var key = document.getElementById('ik').value.trim();
  if (key) {   // 3) 폰에서 직접
    try {
      var url = 'https://openapi.its.go.kr:9443/trafficInfo?apiKey=' + encodeURIComponent(key) + '&type=all&getType=json&minX=126.35&maxX=126.85&minY=37.35&maxY=37.65';
      var ctl = new AbortController(); setTimeout(function () { ctl.abort(); }, 20000);
      var t = await fetch(url, { signal: ctl.signal }).then(function (x) { return x.text(); });
      var jj = JSON.parse(t), items = (jj && jj.body && jj.body.items) || [];
      if (items.length) return { items: items, from: '폰에서 직접' };
      tried.push('직접: 자료 없음');
    } catch (e) { tried.push('직접 실패: ' + e); }
  } else tried.push('(키 입력칸이 비어 있어 직접 받기는 안 함)');
  return { items: [], from: '', tried: tried };
}

document.getElementById('go').onclick = async function () {
  out.innerHTML = ''; msg.textContent = '불러오는 중...';
  try {
    var tr = await loadTraffic();
    if (!tr.items.length) { msg.textContent = '소통정보를 받지 못했습니다.\n' + (tr.tried || []).join('\n'); return; }
    var byId = {}, sample = [], itsNames = {};
    tr.items.forEach(function (it) { var id = String(it.linkId || '').trim(); if (!id) return; byId[id] = it; if (it.roadName) itsNames[String(it.roadName).replace(/\s+/g, '')] = 1; if (sample.length < 3) sample.push(id); });
    var routes = ['202', '202A', '203', '203A', '204', '205', '206', '221', '281', '282'];
    var h = '<table><tr><th>노선</th><th>우리 링크</th><th>소통정보에 있음</th><th>속도 있는 구간</th></tr>', allMine = 0, allHit = 0, detail = '';
    for (var r = 0; r < routes.length; r++) {
      var f = await fetch('data/route/' + routes[r] + '_links.json', { cache: 'no-cache' }).then(function (x) { return x.ok ? x.json() : null; });
      if (!f) { h += '<tr class="skip"><td>' + routes[r] + '</td><td colspan="3">파일 없음</td></tr>'; continue; }
      var ids = {}, segHit = 0, noSp = [];
      f.segs.forEach(function (sg) { var any = false; sg.forEach(function (id) { ids[id] = 1; if (byId[id]) any = true; }); if (any) segHit++; else noSp.push(f.segs.indexOf(sg)); });
      var mine = Object.keys(ids), hit = mine.filter(function (id) { return byId[id]; }).length;
      allMine += mine.length; allHit += hit;
      var pct = mine.length ? Math.round(hit * 100 / mine.length) : 0;
      h += '<tr class="' + (pct >= 60 ? 'ok' : (pct >= 20 ? 'part' : 'no')) + '"><td>' + routes[r] + '</td><td class="n">' + mine.length + '개</td><td class="s n">' + hit + '개 (' + pct + '%)</td><td class="n">' + segHit + ' / ' + f.segs.length + '</td></tr>' + (noSp.length ? noSp.map(function (si) {
        var nm = {}; f.segs[si].forEach(function (id) { var inf = f.links && f.links[id]; if (inf && inf[2] && inf[2] !== '-') nm[inf[2].replace(/번길.*$/, '').replace(/\s+/g, '')] = 1; });
        var names = Object.keys(nm), inIts = names.filter(function (n) { return itsNames[n]; });
        var kind = !names.length ? '🅰 우리 쪽 확인 필요 (도로 이름 없는 링크뿐)' : (inIts.length ? '🅰 우리 쪽 확인 필요 (소통정보에 같은 이름 도로가 있는데 이 구간 링크에만 없음)' : '🅱 진짜 없음 (소통정보에 이 도로 이름 자체가 없음)');
        return '<tr class="skip"><td></td><td colspan="3">' + (si + 1) + '번째: ' + (names.join(', ') || '이름 없음') + '<div class="sub">' + kind + '</div></td></tr>';
      }).join('') : '');
    }
    out.innerHTML = h + '</table>';
    var ex = Object.keys(byId).slice(0, 3);
    msg.textContent = '소통정보 출처: ' + tr.from + ' / 소통정보 ' + tr.items.length + '건, 링크번호 ' + Object.keys(byId).length + '개\n전체: 우리 링크 ' + allMine + '개 중 ' + allHit + '개가 소통정보에 있음\n번호 모양 비교 — 소통정보: ' + ex.join(', ') + ' / 우리: 1720572300 형태(10자리)';
  } catch (e) { msg.textContent = '실패: ' + (e && e.message || e); }
};

// 범위 시험: 영종·청라 작은 사각형과 도로 종류를 바꿔 가며 몇 건이 오는지 본다 (각각 20초 안에 안 오면 실패)
document.getElementById('rng').onclick = async function () {
  var key = document.getElementById('ik').value.trim();
  if (!key) { msg.textContent = 'ITS 키 칸에 키를 붙여넣어 주세요(저장되지 않음).'; return; }
  var box = 'minX=126.40&maxX=126.80&minY=37.40&maxY=37.60';
  var tests = [
    ['영종 전체(126.40~126.62, 37.40~37.56)', 'type=all&minX=126.40&maxX=126.62&minY=37.40&maxY=37.56'],
    ['영종 중앙 작게(126.48~126.58, 37.43~37.52)', 'type=all&minX=126.48&maxX=126.58&minY=37.43&maxY=37.52'],
    ['청라(126.60~126.72, 37.50~37.58)', 'type=all&minX=126.60&maxX=126.72&minY=37.50&maxY=37.58'],
    ['아주 작게(126.52~126.54, 37.46~37.48)', 'type=all&minX=126.52&maxX=126.54&minY=37.46&maxY=37.48'],
    ['영종+청라 한 번에(126.40~126.72, 37.40~37.58)', 'type=all&minX=126.40&maxX=126.72&minY=37.40&maxY=37.58']
  ];
  var h = '<table><tr><th>방법</th><th>건수</th><th>인천(17) 비율</th></tr>';
  out.innerHTML = ''; 
  for (var i = 0; i < tests.length; i++) {
    msg.textContent = '시험 중... ' + (i + 1) + ' / ' + tests.length;
    var row;
    try {
      var ctl = new AbortController(); var tm = setTimeout(function () { ctl.abort(); }, 20000);
      var t = await fetch('https://openapi.its.go.kr:9443/trafficInfo?apiKey=' + encodeURIComponent(key) + '&getType=json&' + tests[i][1], { signal: ctl.signal }).then(function (x) { return x.text(); });
      clearTimeout(tm);
      var jj = JSON.parse(t), items = (jj && jj.body && jj.body.items) || [];
      var inc = items.filter(function (it) { return String(it.linkId || '').slice(0, 2) === '17'; }).length;
      row = '<tr><td>' + tests[i][0] + '</td><td class="n">' + items.length + '건 (' + Math.round(t.length / 1024) + 'KB)</td><td class="n">' + inc + '건</td></tr>';
    } catch (e) { row = '<tr class="no"><td>' + tests[i][0] + '</td><td colspan="2">실패</td></tr>'; }
    h += row; out.innerHTML = h + '</table>';
  }
  msg.textContent = '끝났습니다. 이 화면을 캡처해서 보내 주세요.';
};
</script>
</body>
</html>
