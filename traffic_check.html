<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>국토교통부 도로 소통 점검</title>
<style>
  body { font-family: -apple-system, 'Malgun Gothic', sans-serif; margin: 0; padding: 16px; background: #0f172a; color: #e2e8f0; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  button { font-size: 16px; padding: 10px 14px; border-radius: 8px; border: 0; background: #2563eb; color: #fff; font-weight: 700; width: 100%; }
  #msg { margin: 12px 0; font-size: 13px; color: #fbbf24; white-space: pre-wrap; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td, th { padding: 4px 3px; border-bottom: 1px solid #1e293b; text-align: left; word-break: break-all; }
  th { color: #94a3b8; }
</style>
</head>
<body>
<h1>🚦 국토교통부 도로 소통 점검</h1>
<div id="loginBox" style="background:#1e293b;border-radius:10px;padding:12px;margin-bottom:12px;font-size:13px;color:#94a3b8;">
  이 화면은 앱과 따로 저장되어 로그인이 안 되어 있을 수 있습니다. 그러면 아래에 한 번만 입력해 주세요(이 폰에만 저장됩니다).
  <input id="nm" placeholder="이름" style="width:100%;box-sizing:border-box;margin-top:8px;padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:16px;">
  <input id="pn" placeholder="기사번호 6자리" inputmode="numeric" style="width:100%;box-sizing:border-box;margin-top:6px;padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:16px;">
</div>
<button id="go">소통정보 불러오기</button>
<button id="go3" style="margin-top:8px;background:#0d9488;">저장된 소통정보(data/traffic.json) 보기</button>
<div style="background:#1e293b;border-radius:10px;padding:12px;margin:14px 0;font-size:13px;color:#94a3b8;">
  <b>시험 2: 폰에서 직접 받기</b> (서버를 거치지 않음. 키는 이 화면에서만 쓰고 저장하지 않습니다)
  <input id="ik" placeholder="국토교통부 ITS 키 붙여넣기" style="width:100%;box-sizing:border-box;margin-top:8px;padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:16px;">
  <button id="go2" style="margin-top:8px;">폰에서 직접 불러오기</button>
  <div id="msg2" style="margin-top:8px;color:#fbbf24;white-space:pre-wrap;"></div>
</div>
<div id="msg"></div>
<div id="out"></div>
<script src="js/app-config.js"></script>
<script src="js/gas-polyfill.js"></script>
<script>
document.getElementById('go').onclick = function () {
  var nm = document.getElementById('nm').value.trim(), pn = document.getElementById('pn').value.trim();
  if (nm && pn) { try { localStorage.setItem('loggedInUser', nm); localStorage.setItem('autoLoginPin', pn); } catch (e) { } }
  var msg = document.getElementById('msg'), out = document.getElementById('out');
  msg.textContent = '불러오는 중...'; out.innerHTML = '';
  fetch(window.GAS_WEB_APP_URL + '?action=get_traffic_flow').then(function (r) { return r.json(); }).then(function (res) {
    var items = (res && res.items) || [];
    msg.textContent = '성공: ' + (res && res.success) + ' / 건수: ' + items.length + ' / 시각: ' + (res && res.timestamp || '-') + (res && res.error ? '\n오류: ' + res.error : '');
    if (!items.length) { out.textContent = JSON.stringify(res).slice(0, 800); return; }
    var keys = Object.keys(items[0]);
    var h = '<p>항목 이름: ' + keys.join(', ') + '</p><table><tr>' + keys.map(function (k) { return '<th>' + k + '</th>'; }).join('') + '</tr>';
    items.slice(0, 40).forEach(function (it) { h += '<tr>' + keys.map(function (k) { return '<td>' + (it[k] === undefined ? '' : it[k]) + '</td>'; }).join('') + '</tr>'; });
    out.innerHTML = h + '</table>';
  }).catch(function (e) { msg.textContent = '실패: ' + e; });
};
document.getElementById('go3').onclick = function () {
  var msg = document.getElementById('msg'), out = document.getElementById('out');
  msg.textContent = '불러오는 중...'; out.innerHTML = '';
  fetch('data/traffic.json?t=' + Date.now()).then(function (r) { if (!r.ok) throw new Error('파일 없음(' + r.status + ')'); return r.json(); }).then(function (j) {
    msg.textContent = '갱신: ' + j.updated + ' / 소통 ' + (j.flow || []).length + '건 / 돌발 ' + (j.incidents || []).length + '건' + (j.flowError ? '\n소통 오류: ' + j.flowError : '') + (j.incidentError ? '\n돌발 오류: ' + j.incidentError : '');
    var items = j.flow || [];
    if (!items.length) { out.textContent = '소통 자료 없음'; return; }
    var keys = Object.keys(items[0]);
    var h = '<p>항목 이름: ' + keys.join(', ') + '</p><table><tr>' + keys.map(function (x) { return '<th>' + x + '</th>'; }).join('') + '</tr>';
    items.slice(0, 40).forEach(function (it) { h += '<tr>' + keys.map(function (x) { return '<td>' + (it[x] === undefined ? '' : it[x]) + '</td>'; }).join('') + '</tr>'; });
    out.innerHTML = h + '</table>';
  }).catch(function (e) { msg.textContent = '실패: ' + e; });
};
document.getElementById('go2').onclick = function () {
  var k = document.getElementById('ik').value.trim(), m = document.getElementById('msg2'), out = document.getElementById('out');
  if (!k) { m.textContent = '키를 입력해 주세요.'; return; }
  m.textContent = '불러오는 중... (최대 20초)'; out.innerHTML = '';
  var url = 'https://openapi.its.go.kr:9443/trafficInfo?apiKey=' + encodeURIComponent(k) + '&type=all&getType=json&minX=126.35&maxX=126.85&minY=37.35&maxY=37.65';
  var ctl = new AbortController(); setTimeout(function () { ctl.abort(); }, 20000);
  fetch(url, { signal: ctl.signal }).then(function (r) { return r.text(); }).then(function (t) {
    var j; try { j = JSON.parse(t); } catch (e) { m.textContent = '받았지만 JSON이 아님: ' + t.slice(0, 300); return; }
    var items = (j && j.body && j.body.items) || [];
    m.textContent = '성공 / 건수: ' + items.length;
    if (!items.length) { out.textContent = t.slice(0, 800); return; }
    var keys = Object.keys(items[0]);
    var h = '<p>항목 이름: ' + keys.join(', ') + '</p><table><tr>' + keys.map(function (x) { return '<th>' + x + '</th>'; }).join('') + '</tr>';
    items.slice(0, 40).forEach(function (it) { h += '<tr>' + keys.map(function (x) { return '<td>' + (it[x] === undefined ? '' : it[x]) + '</td>'; }).join('') + '</tr>'; });
    out.innerHTML = h + '</table>';
  }).catch(function (e) { m.textContent = '실패(브라우저가 막았거나 응답 없음): ' + e; });
};
</script>
</body>
</html>
