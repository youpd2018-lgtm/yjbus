<!doctype html>
<html lang="ko">
<head>
<script src="js/script_time_sync.js"></script>
<script src="js/script_test_drive.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>노선 지도</title>
<style>
  /* 앱 전체 글꼴과 동일: 글자=서울알림체, 숫자=G마켓 산스 */
@font-face {
    font-family: 'SeoulNotice';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2505-1@1.0/SeoulAlrimTTF-Medium.woff2') format('woff2');
    font-weight: 500;
    font-display: swap;
}

@font-face {
    font-family: 'SeoulNotice';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2505-1@1.0/SeoulAlrimTTF-Bold.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
}

@font-face {
    font-family: 'SeoulNotice';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2505-1@1.0/SeoulAlrimTTF-ExtraBold.woff2') format('woff2');
    font-weight: 800;
    font-display: swap;
}

@font-face {
    font-family: 'SeoulNotice';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2505-1@1.0/SeoulAlrimTTF-Heavy.woff2') format('woff2');
    font-weight: 900;
    font-display: swap;
}

@font-face {
    font-family: 'GmarketNum';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');
    font-weight: 100 900;
    unicode-range: U+0030-0039;
    font-display: swap;
}

  :root { --app-font: 'GmarketNum', 'SeoulNotice', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  #card, #card button, #card input, #card select { font-family: var(--app-font); }
  :root { --sat: max(env(safe-area-inset-top), 40px); }   /* 폰 맨 위 상태표시줄 아래로 내림 */
  html, body { margin: 0; height: 100%; background: #0f172a; color: #e2e8f0; font-family: -apple-system, 'Malgun Gothic', sans-serif; overflow: hidden; }
  #top { position: absolute; top: 0; left: 0; right: 0; z-index: 20; padding: 8px; padding-top: calc(8px + var(--sat)); display: flex; gap: 6px; background: rgba(15,23,42,.92); }
  #top select, #top button { font-size: 15px; padding: 8px 10px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; }
  #top button.on { background: #2563eb; border-color: #2563eb; }
  #top select { flex: 1; min-width: 0; }
  #tip { display: none; position: absolute; left: 12px; right: 12px; top: calc(110px + var(--sat)); z-index: 40; background: rgba(15,23,42,.92); border: 1.5px solid rgba(56,189,248,.6); border-radius: 14px; padding: 14px; box-shadow: 0 6px 22px rgba(0,0,0,.6); text-align: center; }
  body.nonadmin #tip { top: calc(86px + var(--sat)); }
  #tip .tt { font-size: 18px; font-weight: 800; line-height: 1.4; color: #fff; }
  #tip .tb { display: flex; gap: 8px; margin-top: 12px; }
  #tip button { flex: 1; font-size: 15px; font-weight: 700; padding: 10px 6px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #fff; }
  #tip button#tipNever { background: #0369a1; border-color: #0369a1; }
  #rot { display: none; position: fixed; inset: 0; z-index: 99; background: #0f172a; color: #fff; font-size: 20px; font-weight: 800; align-items: center; justify-content: center; }
  @media (orientation: landscape) and (max-height: 520px) { #rot { display: flex; } }
  body.nonadmin #view { top: calc(68px + var(--sat)); }
  body.nonadmin #msg { top: calc(78px + var(--sat)); }
  #view { position: absolute; top: calc(96px + var(--sat)); bottom: 0; left: 0; right: 0; overflow: hidden; }
  #map { position: absolute; left: -50%; top: -50%; width: 200%; height: 200%; transition: transform .9s linear; will-change: transform; transform-origin: 50% 50%; }
  #card { position: absolute; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); z-index: 20; background: linear-gradient(180deg, rgba(6,78,59,.9) 0%, rgba(2,44,34,.92) 100%); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border: 2px solid rgba(110,231,183,.55); box-shadow: 0 4px 18px rgba(0,0,0,.55); text-shadow: 0 1px 3px rgba(0,0,0,.95), 0 0 8px rgba(0,0,0,.75); border-radius: 14px; padding: 10px 14px; }
  #card .lb { font-size: 12px; color: #94a3b8; }
  #rowA { display: flex; flex-direction: column; align-items: flex-start; text-align: left; }   /* 2026-10-12: 거리 위, 정류장 이름 아래 두 줄로 오른쪽 끝 */
  #rowA .nm { font-size: 21px; line-height: 27px; width: max-content; max-width: 8.8em; font-weight: 800; margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #rowA .ds { font-size: 26px; line-height: 32px; text-align: left; min-width: 0; color: #38bdf8; font-weight: 800; white-space: nowrap; overflow: visible; font-variant-numeric: tabular-nums; }
  #rowB { display: flex; align-items: center; gap: 10px; margin-top: 12px; min-height: 40px; }
  #cdTime { font-size: 42px !important; line-height: 46px; flex: 0 0 auto; text-align: left; white-space: nowrap; }
  #card .big { font-size: 24px; font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #cdBadge { flex: 0 0 auto; white-space: nowrap; min-width: 52px; text-align: center; padding: 2px 10px; border-radius: 12px; border: 2px solid #34c759; background: rgba(52,199,89,.15); color: #34c759; }
  #anchorCard { display: none; position: absolute; left: 0; bottom: calc(100% + 6px); max-width: 60%; flex-direction: column; align-items: flex-start; padding: 5px 12px 6px; border-radius: 14px; background: linear-gradient(180deg, rgba(6,78,59,.92) 0%, rgba(2,44,34,.94) 100%); border: 2px solid rgba(110,231,183,.55); box-shadow: 0 4px 18px rgba(0,0,0,.55); font-family: var(--app-font); }
  #anchorCard.on { display: flex; }
  #anchorName { max-width: 100%; font-size: 15px; line-height: 20px; font-weight: 700; color: #fed7aa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #anchorTime { font-size: 26px; line-height: 30px; font-weight: 800; color: #FDE047; font-variant-numeric: tabular-nums; }
  body.standalone #cdTime, body.standalone #cdBadge { display: none; }
  #card .sub { font-size: 13px; color: #94a3b8; margin-top: 4px; }
  #msg { position: absolute; top: calc(106px + var(--sat)); left: 8px; right: 8px; z-index: 20; font-size: 13px; color: #fbbf24; white-space: pre-wrap; }
  .tag { padding: 3px 8px; border-radius: 8px; font-size: 13px; font-weight: 800; color: #fff; white-space: nowrap; border: 2px solid #fff; }
  #card { max-height: 55%; overflow: visible; }
  /* 2026-10-12: 시간 카운트·오차 배지·거점 이름 = 화면 맨 아래 가운데 한 줄(거점 이름이 길면 …), 다음 정류장 = 오른쪽 끝(내 위치 높이, 박스 높이만큼 위) */
  #card { left: 50%; right: auto; transform: translateX(-50%); width: calc(100% - 12px); max-width: 560px; bottom: calc(16px + env(safe-area-inset-bottom)); padding: 10px 8px; box-sizing: border-box; }
  #card #rowB { display: flex; align-items: center; gap: 10px; margin-top: 0; min-height: 0; flex-wrap: nowrap; }
  #card #cdTime { font-size: 38px !important; line-height: 44px; }
  #rowA { position: fixed; right: 8px; top: calc(96px + var(--sat) + (100vh - 96px - var(--sat)) * 0.6 + 44px); z-index: 20; box-sizing: border-box; width: max-content; max-width: calc(100vw - 16px); align-items: flex-start; text-align: left; padding: 6px 12px 8px; border-radius: 14px; background: linear-gradient(180deg, rgba(6,78,59,.92) 0%, rgba(2,44,34,.94) 100%); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border: 2px solid rgba(110,231,183,.55); box-shadow: 0 4px 18px rgba(0,0,0,.55); text-shadow: 0 1px 3px rgba(0,0,0,.95), 0 0 8px rgba(0,0,0,.75); }   /* 2026-10-12: 아래 시간 박스와 같은 초록 카드, 거리·이름 가운데 정렬 */
  body.nonadmin #rowA { top: calc(68px + var(--sat) + (100vh - 68px - var(--sat)) * 0.6 + 44px); }
  #rowA .nm { box-sizing: border-box; padding: 0; text-align: left; }   /* 글자 테두리·번짐이 박스 끝에서 칼같이 잘리지 않게 안쪽 여백 */
  #rowA .ds { padding: 0; text-align: left; }
  #spd { position: fixed; left: 12px; top: calc(96px + var(--sat) + (100vh - 96px - var(--sat)) * 0.4 - 10px); transform: translateY(-50%); z-index: 20; background: none; border: 0; padding: 0; box-shadow: none; font-family: var(--app-font); color: #e2e8f0; -webkit-text-stroke: 2px #022C22; paint-order: stroke fill; text-shadow: 0 0 3px #022C22, 0 0 6px #064E3B, 0 1px 3px #022C22; }   /* 2026-10-13: 박스·km/h 없이 숫자만 */
  body.nonadmin #spd { top: calc(68px + var(--sat) + (100vh - 68px - var(--sat)) * 0.4 - 10px); }
  #spd b { font-size: 29px; line-height: 34px; font-weight: 800; min-width: 2.2em; text-align: left; font-variant-numeric: tabular-nums; }
  .mebus { width: 50px; height: 50px; margin: -25px 0 0 -25px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); transition: transform .3s linear; }
  .mebus svg { width: 100%; height: 100%; display: block; }
  .me { width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: #2563eb; border: 3px solid #fff; box-shadow: 0 0 0 4px rgba(37,99,235,.35); }
  .dot { width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: #fff; border: 2px solid #475569; }
  .dot.past { background: #94a3b8; border-color: #64748b; }
  .ring { width: 32px; height: 32px; border-radius: 50%; border: 3px solid rgba(239,68,68,.8); box-sizing: border-box; pointer-events: none; }   /* 다음 정류장: 속이 빈 빨간 테두리 원 */
  .dot.anchor { background: #ef4444; border-color: #fff; }

  /* 2026-10-13: 위는 작은 박스, 아래는 긴 박스가 한 덩어리로 이어진 모양 (아래 카운트 박스 + 거점 탭, 다음 정류장 거리 탭 + 이름 박스) */
  #card { background: linear-gradient(180deg, rgb(6,78,59) 0%, rgb(2,44,34) 100%); -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: none; filter: drop-shadow(0 4px 10px rgba(0,0,0,.55)); padding: 14px 16px 14px; }
  #card.tab { border-top-left-radius: 0; }
  #card #rowB { gap: 16px; }
  #anchorCard { left: -2px; bottom: 100%; max-width: 62%; margin: 0; background: rgb(6,78,59); border-bottom: 0; border-radius: 14px 14px 14px 0; box-shadow: none; padding: 6px 14px 4px; }
  #rowA { background: none; border: 0; box-shadow: none; padding: 0; backdrop-filter: none; -webkit-backdrop-filter: none; text-shadow: none; filter: drop-shadow(0 4px 10px rgba(0,0,0,.55)); align-items: flex-start; }
  #rowA .ds { position: relative; z-index: 1; margin-bottom: -2px; padding: 4px 14px 2px; background: rgb(6,78,59); border: 2px solid rgba(110,231,183,.55); border-bottom: 0; border-radius: 14px 14px 14px 0; }
  #rowA .nm { align-self: stretch; max-width: calc(8.8em + 32px); padding: 5px 14px 8px; background: linear-gradient(180deg, rgb(6,78,59) 0%, rgb(2,44,34) 100%); border: 2px solid rgba(110,231,183,.55); border-radius: 0 14px 14px 14px; text-shadow: 0 1px 3px rgba(0,0,0,.9); }

  /* 2026-10-13(2): 아래 카드는 내용 폭만큼(오차 쪽으로 좁힘), 탭은 바깥쪽으로 퍼지며 이어지는 모양, 거점 글자·시간 키움, 속도 숫자 키움 */
  #card { left: 6px; right: auto; transform: none; width: max-content; max-width: calc(100% - 12px); padding: 14px 20px 14px 16px; }
  #anchorCard { padding: 7px 16px 5px; border-radius: 14px 14px 0 0; }
  #anchorName { font-size: 18px; line-height: 24px; margin-bottom: 2px; }
  #anchorTime { font-size: 30px; line-height: 34px; }
  #anchorCard::after, #rowA .ds::after { content: ''; position: absolute; right: -18px; bottom: 0; width: 18px; height: 16px; background: radial-gradient(circle at 16px 0, transparent 14px, rgb(63,162,127) 14px, rgb(63,162,127) 16px, rgb(6,78,59) 16px); pointer-events: none; }
  #rowA .ds { border-radius: 14px 14px 0 0; }
  #spd { left: 22px; -webkit-text-stroke: 1px #022C22; text-shadow: 0 0 2px #022C22, 0 1px 2px #022C22; }
  #spd b { font-size: 39px; line-height: 44px; }
  #rowA { right: auto; left: calc(100vw - 8px - 205px); }   /* 글자가 줄면 왼쪽 끝은 고정, 오른쪽이 줄어듦 */
  #cdTime { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; text-align: left; }
  #card #rowB { gap: 24px; }

  /* 2026-10-13: 노선 선택 칸은 없애고(오늘 근무 노선이 자동으로 열림), 위쪽 버튼 두 개를 양쪽에 크게 */
  #route { display: none; }
  #top { padding: 6px 8px 8px; padding-top: calc(6px + var(--sat)); gap: 10px; }
  #top button { flex: 1 1 0; font-size: 20px; font-weight: 800; padding: 14px 6px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
  #top button svg { width: 22px; height: 22px; margin: 0 !important; vertical-align: 0 !important; }

  /* 2026-10-13(3): 거점 박스는 아래 카운트 박스와 분리(10px 간격), 이름 색은 라이브 모달과 같게(가리키는 거점이면 흰색 굵게, 아니면 흐린 흰색) */
  #card.tab { border-top-left-radius: 14px; }
  #anchorCard { bottom: calc(100% + 10px); border-bottom: 2px solid rgba(110,231,183,.55); border-radius: 14px; background: linear-gradient(180deg, rgb(6,78,59) 0%, rgb(2,44,34) 100%); box-shadow: 0 4px 18px rgba(0,0,0,.55); }
  #anchorCard::after { display: none; }
  #anchorName { color: rgba(255,255,255,.65); font-weight: 700; }
  #anchorCard.act #anchorName { color: #fff; font-weight: 800; }

  /* 2026-10-13(4): 하단 박스 안쪽 여백 5px씩 더 */
  #card { padding: 19px 25px 19px 21px; }
  #anchorCard { padding: 12px 21px 10px; }

  /* 2026-10-13(5): 다음 정류장 박스는 이름 8글자 기준 크기로 고정(이름이 짧아도 박스가 이상하게 줄지 않음) */
  #rowA { width: 205px; max-width: 205px; }
  #rowA .nm { width: auto; max-width: none; }

  /* 2026-10-13(6): 거점 3칸을 맨 위(버튼 아래)에 가로로: 박스 없이 가는 선으로 나누고 가운데만 밝게, 양옆은 흐리게 */
  :root { --th: 68px; }
  body.hasAnc { --th: 150px; }
  #anc { display: none; position: absolute; left: 0; right: 0; top: calc(68px + var(--sat)); height: 82px; z-index: 19; background: linear-gradient(180deg, rgb(6,78,59) 0%, rgb(2,44,34) 100%); border-bottom: 2px solid rgba(110,231,183,.55); font-family: var(--app-font); }
  body.hasAnc #anc { display: flex; }
  #anc .c { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 4px; opacity: .65; }
  #anc .c + .c { border-left: 2px solid rgba(110,231,183,.55); }
  #anc .c.mid { opacity: 1; }
  #anc .c { transition: flex-grow .3s; }
  #anc .n { max-width: 100%; font-size: 15px; line-height: 20px; font-weight: 700; color: #fed7aa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #anc .t { font-size: 24px; line-height: 30px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
  #anc .c.mid .n { font-size: 19px; line-height: 24px; color: #fff; font-weight: 800; }
  #anc .c.mid .t { font-size: 34px; line-height: 38px; }
  #anchorCard { display: none !important; }
  #card.tab { border-top-left-radius: 14px; }
  body.nonadmin #view { top: calc(var(--th) + var(--sat)); }
  body.nonadmin #rowA { top: calc(var(--th) + var(--sat) + (100vh - var(--th) - var(--sat)) * 0.6 + 44px); }
  body.nonadmin #spd { top: calc(var(--th) + var(--sat) + (100vh - var(--th) - var(--sat)) * 0.4 - 10px); }

  /* 2026-10-13(7): 하단도 상단처럼 한 덩어리 초록 바탕 + 가는 선으로만 구분. 윗줄 = 다음 정류장 거리 | 정류장 이름, 아랫줄 = 시간 카운트 | 오차 */
  #bot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); background: linear-gradient(180deg, rgb(6,78,59) 0%, rgb(2,44,34) 100%); border-top: 2px solid rgba(110,231,183,.55); font-family: var(--app-font); text-shadow: none; }
  #bot #rowA { position: static; display: flex; flex-direction: row; align-items: stretch; width: auto; max-width: none; left: auto; right: auto; top: auto; padding: 0; margin: 0; background: none; border: 0; border-bottom: 2px solid rgba(110,231,183,.55); border-radius: 0; box-shadow: none; filter: none; }
  #bot #rowA .ds { flex: 0 0 38%; margin: 0; padding: 8px 6px; background: none; border: 0; border-right: 2px solid rgba(110,231,183,.55); border-radius: 0; text-align: center; font-size: 28px; line-height: 34px; }
  #bot #rowA .ds::after { display: none; }
  #bot #rowA .nm { flex: 1 1 0; width: auto; max-width: none; margin: 0; padding: 8px 8px; background: none; border: 0; border-radius: 0; text-align: center; align-self: center; font-size: 22px; line-height: 28px; }
  #bot #card { position: static; transform: none; width: auto; max-width: none; margin: 0; padding: 0; background: none; border: 0; border-radius: 0; box-shadow: none; filter: none; overflow: visible; }
  #bot #card #rowB { gap: 0; align-items: stretch; }
  #bot #card #cdTime { flex: 0 0 62%; width: 62% !important; min-width: 0 !important; box-sizing: border-box; padding: 8px 4px; text-align: center; border-right: 2px solid rgba(110,231,183,.55); font-size: 44px !important; line-height: 50px; }
  #bot #card #cdBadge { flex: 1 1 0; align-self: stretch; display: flex; align-items: center; justify-content: center; margin: 0; padding: 0; min-width: 0; font-size: 30px; border: 0 !important; border-radius: 0 !important; box-shadow: none !important; }

  /* 2026-10-13(8): 거리·이름 글자를 칸에 최대한 꽉 차게(안 들어가면 한 단계씩 줄임) */
  #bot #rowA .ds { font-size: 40px; line-height: 46px; padding: 6px 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  #bot #rowA .nm { font-size: 32px; line-height: 40px; padding: 6px 6px; overflow: hidden; display: flex; align-items: center; justify-content: center; }

  /* 2026-10-13(9): 시간 카운트 칸 꽉 채우고, 오차 칸은 홀쭉하게(오른쪽 빈 자리는 마이크 버튼 자리) */
  #bot #card #cdTime { flex: 0 0 58%; width: 58% !important; padding: 6px 2px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  #bot #card #cdBadge { flex: 0 0 24%; width: 24%; font-size: 34px; }

  /* 2026-10-13(10): 오차 색 = 라이브 모달과 같은 단계(±5 연두 / ±6~10 노랑 / 그 이상 분홍). 숫자·칸 테두리·하단 윗선이 같이 바뀜 */
  body { --ac: #6EE7B7; }
  #bot { border-top-color: var(--ac); transition: border-color .4s; }
  #bot #card #cdBadge { color: var(--ac) !important; background: rgba(255,255,255,.06) !important; box-shadow: inset 0 0 0 4px var(--ac) !important; transition: color .4s, box-shadow .4s; }
  #bot #card #cdTime { padding: 4px 0; flex-basis: 60%; width: 60% !important; }
  #bot #card #cdBadge { flex-basis: 24%; width: 24%; }

  /* 2026-10-13(11): 앱 버튼과 하단 카운트 줄은 같은 초록 계열에서 한 단계 더 진하게 */
  #top #btnBack { background: linear-gradient(180deg, #035c43 0%, #01372a 100%); border-color: rgba(110,231,183,.55); }
  #bot #card { background: linear-gradient(180deg, rgba(1,32,25,.96) 0%, rgba(0,22,17,.98) 100%); }

<script>
  // 카카오 JavaScript 키 (사이트 주소 제한이 걸려 있어 코드에 있어도 안전)
  const KAKAO_JS_KEY = 'e5b58be31dc1470a91e6f354662a32e6';
  const ROUTES = ['202', '202A', '203', '203A', '204', '205', '206', '221', '281', '282'];
  const $ = (id) => document.getElementById(id);
  const EMBED = /[?&]embed=1/.test(location.search);
  if (!EMBED) document.body.classList.add('standalone');
  const SIM = /[?&]sim=1/.test(location.search);   // 책상에서 시험: 지도를 누르면 그 곳이 내 위치

  let map, route = null, segLines = [], dots = [], meOv = null, ringOv = null;
  let follow = true, headUp = true, traffic = false;   // 켜면 처음부터 [따라가기]·[방향] 선택됨
  let parentAnchor = '', parentNext = '';
  let me = null, heading = 0, lastMe = null, nextIdx = 0;

  try { screen.orientation.lock('portrait').catch(() => { }); } catch (e) { }   // 세로 고정(설치형 앱에서 동작, 안 되면 가로일 때 안내 화면)
  let isAdmin = false;
  // 오류가 나면 관리자 화면 위쪽 글자 줄에 보여 준다(원인 찾기용)
  function showErr(m) { try { if (isAdmin || /[?&]debug=1/.test(location.search)) $('msg').textContent = '오류: ' + m; } catch (e) { } }
  window.addEventListener('error', e => showErr(e.message + (e.lineno ? ' (줄 ' + e.lineno + ')' : '')));
  window.addEventListener('unhandledrejection', e => showErr(String(e.reason && e.reason.message || e.reason)));
  // 모의주행·수정은 관리자(유재필)에게만 보인다 (수정 내용은 어차피 그 폰에만 저장됨)
  (function () {
    var nm = '';
    try { var u = JSON.parse(localStorage.getItem('yeongjong_logged_user') || 'null'); if (u && u.name) nm = u.name; } catch (e) { }
    if (!nm) { try { nm = localStorage.getItem('loggedInUser') || ''; } catch (e) { } }
    document.body.classList.add('nonadmin');   // 수정·기록·모의주행은 앱에서 없앰(수정은 map_draw.html 에서)
    if (String(nm).indexOf('유재필') !== -1) isAdmin = true;
  })();

  ROUTES.forEach(r => { const o = document.createElement('option'); o.value = o.textContent = r; $('route').appendChild(o); });
  try { const s = localStorage.getItem('yb_map_route'); if (s && ROUTES.includes(s)) $('route').value = s; } catch (e) { }
  try { const q = new URLSearchParams(location.search).get('route'); if (q && ROUTES.includes(q)) $('route').value = q; } catch (e) { }   // 앱의 [노선지도] 버튼: 오늘 근무 노선

  function loadKakao() {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + KAKAO_JS_KEY + '&autoload=false';
      s.onload = () => kakao.maps.load(resolve);
      s.onerror = () => reject(new Error('카카오 지도 스크립트를 불러오지 못했습니다 (키 또는 사이트 도메인 등록 확인)'));
      document.head.appendChild(s);
    });
  }

  function name6(t) { t = String(t || ''); return t.length > 8 ? t.slice(0, 8) + '…' : t; }   // 정류장 이름은 8글자까지, 넘으면 …
  function distM(la1, lo1, la2, lo2) {
    const R = 6371000, d2r = Math.PI / 180;
    const dla = (la2 - la1) * d2r, dlo = (lo2 - lo1) * d2r;
    const a = Math.sin(dla / 2) ** 2 + Math.cos(la1 * d2r) * Math.cos(la2 * d2r) * Math.sin(dlo / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  function bearing(la1, lo1, la2, lo2) {
    const d2r = Math.PI / 180, y = Math.sin((lo2 - lo1) * d2r) * Math.cos(la2 * d2r);
    const x = Math.cos(la1 * d2r) * Math.sin(la2 * d2r) - Math.sin(la1 * d2r) * Math.cos(la2 * d2r) * Math.cos((lo2 - lo1) * d2r);
    return (Math.atan2(y, x) / d2r + 360) % 360;
  }

  async function showRoute(name) {
    $('msg').textContent = name + ' 노선 불러오는 중...';
    const res = await StdCalc.loadRoute(name);
    if (!res) { $('msg').textContent = '노선을 못 불러왔습니다: ' + (StdCalc.getLastError() || '로그인/네트워크 확인'); return; }
    $('msg').textContent = '';
    try { localStorage.setItem('yb_map_route', name); } catch (e) { }
    route = { name, stops: res.stops.filter(s => s[2] && s[3]), anchors: res.anchors || [] };
    route.prog = 0; route.leg = legOf(1);
    segLines.forEach(l => l.setMap(null)); segLines = [];
    dots.forEach(d => d.setMap(null)); dots = [];
    if (ringOv) { ringOv.setMap(null); ringOv = null; }
    const path = route.stops.map(s => new kakao.maps.LatLng(s[2], s[3]));
    route.segs = route.stops.slice(1).map((x, i) => [[route.stops[i][2], route.stops[i][3]], [x[2], x[3]]]);
    joinPts(route); renderSegs();
    route.stops.forEach((s, i) => {
      const el = document.createElement('div'); el.className = 'dot' + (route.anchors.includes(i) ? ' anchor' : '');
      const ov = new kakao.maps.CustomOverlay({ map, position: path[i], content: el, yAnchor: .5, xAnchor: .5 });
      ov._el = el; dots.push(ov);
    });
    applyLegDots();
    const b = new kakao.maps.LatLngBounds(); path.forEach((p, i) => { if (!route.leg || (i >= route.leg[0] && i <= route.leg[1])) b.extend(p); }); map.setBounds(b);
    update();
    loadCameras();
    loadRoad(route);
  }


  // ---- 노선선: data/map/노선.json 하나만 사용 (수정은 map_draw.html 에서) ----
  const ROAD_KEY = 'yb_road_v2_', EDIT_KEY = 'yb_roadedit_v2_';   // 옛 저장값 지우기용
  function joinPts(r) {
    const pts = [], at = [];
    r.segs.forEach((seg, i) => { at.push(pts.length); pts.push(...(i ? seg.slice(1) : seg)); });
    at.push(pts.length - 1);
    r.pts = pts; r.stopAt = at;
  }

  function renderSegs() {
    segLines.forEach(l => l.setMap(null)); segLines = [];
    {   // 전체를 선 한 줄로 그려서 겹친 곳(상·하행)도 투명도가 똑같게 (옆 괄호 블록) 전체를 선 한 줄로 그려서 겹친 곳(상·하행)도 투명도가 똑같게
      const all = [], lg = route.leg; route.segs.forEach((sg, i) => { if (!lg || (i >= lg[0] && i < lg[1])) sg.forEach(q => all.push(new kakao.maps.LatLng(q[0], q[1]))); });
      segLines.push(new kakao.maps.Polyline({ map, path: all, strokeWeight: 5, strokeColor: '#2563eb', strokeOpacity: .5, zIndex: 2 }));
      // 반대 편도: 기점 둘레(500m) 안쪽만 가늘고 연한 주황색으로 (교차로에서 곧 갈 길이 보이게)
      const an = (route.anchors || []).slice().sort((x, y) => x - y);
      if (lg && an.length >= 3) {
        const legs = []; for (let k = 0; k < an.length - 1; k++) legs.push([an[k], an[k + 1]]);
        legs.forEach(L => {
          let bs = null;
          if (L[1] === lg[0]) bs = route.stops[L[1]]; else if (L[0] === lg[1]) bs = route.stops[L[0]];
          if (!bs) return;
          let run = [];
          const flush = () => { if (run.length > 1) segLines.push(new kakao.maps.Polyline({ map, path: run, strokeWeight: 3, strokeColor: '#f97316', strokeOpacity: .6, zIndex: 1 })); run = []; };
          for (let i = L[0]; i < L[1]; i++) route.segs[i].forEach(q => { if (distM(q[0], q[1], bs[2], bs[3]) <= OTHER_LEG_M) run.push(new kakao.maps.LatLng(q[0], q[1])); else flush(); });
          flush();
        });
      }
      return;
    }
  }



  // ---- 단속카메라 (data/camera/cameras.json, 공공데이터포털 고정식 카메라 중 우리 노선 위 것만) ----
  let camAll = null, camOvs = [], camList = [];
  async function loadCameras() {
    if (!camAll) { try { const r = await fetch('data/camera/cameras.json', { cache: 'no-cache' }); camAll = r.ok ? (await r.json()).cameras || [] : []; } catch (e) { camAll = []; } }
    camList = route ? camAll.filter(c => c.routes.includes(route.name)) : [];
    if (!window.YbCamera.sections) { try { const r = await fetch('data/camera/sections.json', { cache: 'no-cache' }); window.YbCamera.sections = r.ok ? (await r.json()).sections || [] : []; } catch (e) { window.YbCamera.sections = []; } }
    drawCameras();
  }
  // 점(lat,lng)에서 선(점 배열) 까지 최단 거리(m)
  function distToLine(lat, lng, pts) {
    const k = Math.cos(lat * Math.PI / 180), X = 111320, Y = 110540; let best = 1e9;
    for (let i = 1; i < pts.length; i++) {
      const ax = (pts[i - 1][1] - lng) * X * k, ay = (pts[i - 1][0] - lat) * Y, bx = (pts[i][1] - lng) * X * k, by = (pts[i][0] - lat) * Y;
      const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy; let t = l2 ? -(ax * dx + ay * dy) / l2 : 0; t = Math.max(0, Math.min(1, t));
      const d = Math.hypot(ax + t * dx, ay + t * dy); if (d < best) best = d;
    }
    return best;
  }
  // 편도만 보기 중이면 보이는 편도 선에 더 가까운 카메라만 표시 (반대 방향 카메라는 숨김)
  function camOnLeg(lat, lng) {
    const lg = route && route.leg; if (!lg || !route.segs) return true;
    const mine = [], other = [];
    route.segs.forEach((sg, i) => { (i >= lg[0] && i < lg[1] ? mine : other).push(...sg); });
    if (mine.length < 2 || other.length < 2) return true;
    return distToLine(lat, lng, mine) <= distToLine(lat, lng, other) + 1;
  }
  function drawCameras() {
    camOvs.forEach(o => o.setMap(null)); camOvs = [];
    if (!route) return;
    (window.YbCamera.sections || []).filter(sc => sc.routes.includes(route.name) && camOnLeg(sc.start.lat, sc.start.lng)).forEach(sc => [['start', '구간↘'], ['end', '구간■']].forEach(([k, t]) => {
      const el = document.createElement('div'); el.className = 'cam oth'; el.style.borderColor = '#7c3aed'; el.textContent = k === 'start' ? sc.limit : '끝';
      camOvs.push(new kakao.maps.CustomOverlay({ map, position: new kakao.maps.LatLng(sc[k].lat, sc[k].lng), content: el, xAnchor: .5, yAnchor: .5, zIndex: 3 }));
    }));
    camList.filter(c => camOnLeg(c.lat, c.lng)).forEach(c => {
      const el = document.createElement('div'); el.className = 'cam' + (c.type === 'signal' ? ' sig' : c.type === 'other' ? ' oth' : '');
      el.textContent = c.limit ? c.limit : (c.type === 'signal' ? '신호' : '단속');
      camOvs.push(new kakao.maps.CustomOverlay({ map, position: new kakao.maps.LatLng(c.lat, c.lng), content: el, xAnchor: .5, yAnchor: .5, zIndex: 3 }));
    });
  }
  function checkCamera() { YbCamera.update(me ? { lat: me.lat, lon: me.lon, speed: me.speed, heading } : null, route && route.name, $('camAlert')); }

  async function loadRoad(r) {
    let base = null;
    try {   // 1순위: GitHub에 저장된 확정 도로선 (data/map/노선.json)
      const res = await fetch('data/map/' + encodeURIComponent(r.name) + '.json', { cache: 'no-cache' });
      if (res.ok) { const o = await res.json(); if (o && o.n === r.stops.length && o.segs && o.segs.length === r.stops.length - 1) { base = o.segs; r.ghSavedAt = o.savedAt || 1; r.src = 'github'; } else if (o) r.src = '불일치:파일 ' + o.n + '개, 지금 ' + r.stops.length + '개'; }
    } catch (e) { }
    // 노선선은 data/map/노선.json 하나만 쓴다(폰에 남은 옛 수정·자동 생성선은 불러오지 않고 지운다)
    try { localStorage.removeItem(EDIT_KEY + r.name); localStorage.removeItem(ROAD_KEY + r.name); } catch (e) { }
    if (!base) {   // 파일이 없거나 정류장 수가 안 맞으면 정류장끼리 직선
      base = r.stops.slice(1).map((x, i) => [[r.stops[i][2], r.stops[i][3]], [x[2], x[3]]]);
      if (r.src === 'github' || !r.src) r.src = '없음';
    }
    r.base = base; r.segs = base.slice();
    joinPts(r); renderSegs();
  }


  // 편도만 보기: 앵커(출발·기점·도착) 사이 한 방향 구간만 그린다. 지금 가는 구간이 바뀌면 자동 전환
  function legOf(idx) {
    const an = (route.anchors || []).slice().sort((x, y) => x - y);
    if (an.length < 3) return null;                       // 왕복 구분이 없으면 전체
    for (let k = 0; k < an.length - 1; k++) if (idx > an[k] && idx <= an[k + 1]) return [an[k], an[k + 1]];
    return [an[0], an[1]];
  }
  function applyLegDots() {   // 정류장 점은 숨김(깔끔하게)
    dots.forEach(ov => ov.setMap(null));
    if (ringOv) { ringOv.setMap(null); ringOv = null; }
  }

  const LEG_SWITCH_M = 200, OTHER_LEG_M = 500;   // 편도 선 전환 거리 / 반대 편도 선을 보여 줄 기점 둘레
  // 라이브 모달의 거점(도착 거점) 이름으로 지금 달리는 편도(상행/하행)를 정한다. 겹친 길에서 위치만으로는 방향이 헷갈리기 때문
  function legByAnchor() {
    if (!route || !parentAnchor) return null;
    const an = (route.anchors || []).slice().sort((x, y) => x - y);
    if (an.length < 3) return null;
    const norm = t => String(t || '').replace(/\s+/g, '');
    const pa = norm(parentAnchor);
    for (let k = 0; k < an.length - 1; k++) { const nm = norm(route.stops[an[k + 1]][1]); if (nm && (nm === pa || nm.indexOf(pa) >= 0 || pa.indexOf(nm) >= 0)) return [an[k], an[k + 1]]; }
    return null;
  }

  // 내 위치로 다음 정류장 찾기
  function update() {
    if (!route || !me) return;
    const st = route.stops;
    let best = 0, bd = 1e12;
    // 지나온 곳보다 뒤로 크게 돌아가지 않게, 현재 진행 지점 근처부터 우선 탐색
    const lgF = legByAnchor();   // 거점 이름으로 편도가 정해지면 그 편도 정류장 안에서만 찾는다
    const lo = lgF ? lgF[0] : 0, hi = lgF ? lgF[1] : st.length - 1;
    const from = Math.max(lo, route.prog - 2), to = Math.min(hi, route.prog + 12);
    best = lo;
    for (let i = from; i <= to; i++) { const d = distM(me.lat, me.lon, st[i][2], st[i][3]); if (d < bd) { bd = d; best = i; } }
    if (bd > 400) { // 근처에 없으면 전체에서 다시 찾음 (노선 이탈 후 복귀 등)
      for (let i = lo; i <= hi; i++) { const d = distM(me.lat, me.lon, st[i][2], st[i][3]); if (d < bd) { bd = d; best = i; } }
    }
    let next = best;
    if (best < st.length - 1) {
      const a = st[best], b = st[best + 1];
      const ux = b[3] - a[3], uy = b[2] - a[2], vx = me.lon - a[3], vy = me.lat - a[2];
      if (ux * vx + uy * vy > 0 || bd < 25) next = best + 1;   // 이미 지났거나 25m 이내면 다음 정류장
    }
    if (lgF && next > hi) next = hi;
    if (parentNext) {   // 라이브 모달의 '다음 정류장' 이름과 똑같이 맞춘다(같은 이름이 둘이면 내 위치로 계산한 곳에 가까운 쪽)
      let bi = -1, bg = 1e9;
      for (let i = lo; i <= hi; i++) if (String(st[i][1]).trim() === parentNext) { const g = Math.abs(i - next); if (g < bg) { bg = g; bi = i; } }
      if (bi >= 0) next = bi;
    }
    route.prog = Math.max(0, next - 1);
    nextIdx = next;
    let lg = lgF || legOf(next);
    if (route.leg) {   // 편도 선 전환: 달려온 편도의 끝(기점)에 닿았다가 200m 이상 벗어난 뒤에 다음 편도 선으로 바꾼다
      const eN = st[route.leg[1]];
      if (eN && distM(me.lat, me.lon, eN[2], eN[3]) >= LEG_SWITCH_M) route.legArmed = true;
      if (lg && lg.join() !== route.leg.join() && lg[0] === route.leg[1] && route.legArmed && eN && distM(me.lat, me.lon, eN[2], eN[3]) < LEG_SWITCH_M) lg = route.leg;
      else if (lg && lg.join() !== route.leg.join()) route.legArmed = false;
    }
    if ((lg && lg.join()) !== (route.leg && route.leg.join())) { route.leg = lg; renderSegs(); applyLegDots(); try { drawCameras(); } catch (e) { } }
    const s = st[next];
    const d = distM(me.lat, me.lon, s[2], s[3]);
    $('nextName').textContent = name6(s[1]);
    $('nextDist').textContent = d >= 1000 ? (d / 1000).toFixed(1) + ' km' : Math.round(d) + ' m';
    const anc = (route.anchors || []).slice().sort((x, y) => x - y).find(a => a > 0 && a >= next);
    $('sub').textContent = `${route.name}  ·  ${next + 1} / ${st.length}번째 정류장` + (me.speed != null ? `  ·  ${me.speed} km/h` : '');
    dots.forEach((ov, i) => { ov._el.className = 'dot' + (route.anchors.includes(i) ? ' anchor' : '') + (i < next ? ' past' : '') + (i === next ? ' next' : ''); });
  }

  // 내 위치 = 파란 원 + 앞쪽 화살표. 화살표가 가는 방향
  const BUS_SVG = '<svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg" overflow="visible">'
    + '<circle cx="22" cy="22" r="19" fill="#2563eb" fill-opacity=".25"/>'
    + '<path d="M22 -6 L33 10 L11 10 Z" fill="#2563eb" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/>'
    + '<circle cx="22" cy="22" r="11" fill="#2563eb" stroke="#fff" stroke-width="3.4"/></svg>';

  // 앱(부모 화면)이 1초마다 보내 주는 시간카운트·오차배지를 표시
  window.addEventListener('message', (ev) => {
    if (ev.origin !== location.origin || !ev.data || ev.data.type !== 'rm-live') return;
    const d = ev.data;
    if (d.time) $('cdTime').textContent = d.time;
    if ((d.next || '') !== parentNext) { parentNext = d.next || ''; if (route && me) update(); }   // 라이브 모달 다음 정류장
    if (d.anchor && d.anchor !== parentAnchor) { parentAnchor = d.anchor; const lgP = legByAnchor(); if (lgP && !me && (!route.leg || lgP.join() !== route.leg.join())) { route.leg = lgP; renderSegs(); applyLegDots(); } }   // 라이브 모달의 거점 이름과 똑같이
    if (d.gap) { $('gapBv').textContent = d.gap.bv || '-'; $('gapBn').textContent = d.gap.bn || ''; $('gapFv').textContent = d.gap.fv || '-'; $('gapFn').textContent = d.gap.fn || ''; }
    document.body.classList.toggle('hasGap', !!d.gap);
    if (d.anc) { const cs = document.querySelectorAll('#anc .c'); let any = false; d.anc.forEach((a, i) => { if (!cs[i]) return; cs[i].children[0].textContent = a.n; const t = cs[i].children[1]; t.textContent = a.t; t.style.color = a.c || '#fff'; if (a.n && a.t) any = true; });
      let ai = d.anc.findIndex(a => a.on); if (ai < 0) ai = 1; cs.forEach((c, i) => c.classList.toggle('mid', i === ai)); document.body.classList.toggle('hasAnc', any); }
    $('anchorName').textContent = d.midName || ''; $('anchorTime').textContent = d.midTime || '';
    $('anchorCard').classList.toggle('on', !!(d.midName && d.midTime));
    $('anchorCard').classList.toggle('act', !!d.midOn);
    $('anchorTime').style.color = d.midTc || '#fff';   // 라이브 모달과 같은 시간 색 규칙(노랑·빨강·파랑 외에는 흰색)
    $('card').classList.toggle('tab', !!(d.midName && d.midTime));   // 모달의 거점 이름·시간이 둘 다 있을 때만 표시
    const bd = $('cdBadge'); bd.textContent = d.delay || '-'; applyDelayAc(d.delay);
    // 지도 쪽 GPS가 3초 넘게 조용하면 앱이 받은 GPS로 대신 움직인다
    if (d.gps && d.gps.at !== lastParentFix && Date.now() - lastOwnFix > 3000) { lastParentFix = d.gps.at; onPos(d.gps.lat, d.gps.lon, d.gps.spd, d.gps.hd, true); }
    if (d.dc) { bd.style.color = d.dc; bd.style.background = d.db; bd.style.borderColor = d.dbd; }
  });

  let pendingFix = null;
  let lastOwnFix = 0, lastParentFix = 0, gpsWatchId = null;
  function onPos(lat, lon, speedKmh, hd, fromParent) {
    $('spdNum').textContent = speedKmh != null ? Math.round(speedKmh) : '-';
    if (!fromParent) lastOwnFix = Date.now();
    if (!map) { me = { lat, lon, speed: speedKmh }; pendingFix = [lat, lon, speedKmh, hd]; return; }   // 지도가 아직 안 떴으면 위치만 기억(지도 뜬 뒤 다시 처리)
    // 서 있을 때(속도 4km/h 미만) GPS가 조금씩 흔들려도 내 위치는 그 자리에 고정: 20m 넘게 움직여야 새 위치로 인정
    if (me && meOv && (speedKmh == null || speedKmh < 4) && distM(me.lat, me.lon, lat, lon) < 20) { me.speed = speedKmh; return; }
    const prev = me;
    me = { lat, lon, speed: speedKmh };
    // 방향도 달릴 때(5km/h 이상)만 바꿔서, 서 있을 때 지도가 빙글빙글 돌지 않게
    if (hd != null && !isNaN(hd) && speedKmh != null && speedKmh >= 5) heading = hd;
    else if (prev && (speedKmh == null || speedKmh >= 5) && distM(prev.lat, prev.lon, lat, lon) > 10) heading = bearing(prev.lat, prev.lon, lat, lon);
    const ll = new kakao.maps.LatLng(lat, lon);
    const firstFix = !meOv;
    if (!meOv) { const el = document.createElement('div'); el.className = 'mebus'; el.innerHTML = BUS_SVG; meOv = new kakao.maps.CustomOverlay({ map, position: ll, content: el, zIndex: 9 }); disp = { lat, lon }; }
    else glideTo(lat, lon);                     // 1초마다 뚝뚝 옮기지 않고 부드럽게 미끄러지듯 이동
    const dd = ((heading - curAng + 540) % 360) - 180; curAng += dd;   // 359°→1° 처럼 넘어가도 짧은 쪽으로만 회전
    const bel = meOv.getContent(); if (bel && bel.style) bel.style.transform = `rotate(${curAng}deg)`;
    if (follow) { map.setDraggable(false); followView(firstFix); }   // 내 위치가 잡히면 끌기 잠금(확대/축소는 가능)
    else applyRotate();
    update();
    checkCamera();
  }

  // 지도 전체를 CSS로 돌리고 밀어서(회전+이동) 움직임을 부드럽게 한다. 카카오 지도 중심은 많이 벗어날 때만 다시 잡는다.
  const LIMIT = 70;                       // 이만큼(px) 밀리면 지도 중심을 다시 잡음
  let panX = 0, panY = 0;
  function applyRotate() {
    $('map').style.transform = headUp ? `rotate(${-curAng}deg) translate(${-panX}px, ${-panY}px)` : '';
  }
  // 내 위치가 보이는 지도 부분의 70% 지점(2026-10-13 아래 박스에 가려지지 않는 부분 기준으로 변경)에 오도록, 가는 방향 앞쪽을 화면 중심으로 삼는다
  function followView(force) {
    if (!map || !me) return;
    const proj = map.getProjection(), m = $('map');
    const W = m.clientWidth, H = m.clientHeight;
    const bus = proj.containerPointFromCoords(new kakao.maps.LatLng(me.lat, me.lon));
    const vEl = $('view'), botEl = $('bot'), visH = botEl ? Math.max(100, botEl.getBoundingClientRect().top - vEl.getBoundingClientRect().top) : vEl.clientHeight;
    const off = visH * 0.7 - vEl.clientHeight / 2, a = (headUp ? curAng : 0) * Math.PI / 180;
    const tx = bus.x + off * Math.sin(a), ty = bus.y - off * Math.cos(a);
    let dx = tx - W / 2, dy = ty - H / 2;
    if (force || Math.hypot(dx, dy) > LIMIT) {
      m.style.transition = 'none';
      map.setCenter(proj.coordsFromContainerPoint(new kakao.maps.Point(tx, ty)));
      panX = 0; panY = 0; applyRotate();
      void m.offsetWidth; m.style.transition = '';
      return;
    }
    panX = dx; panY = dy; applyRotate();
  }
  // 지도를 손으로 옮겨 보기 전에, 지금 화면에 보이는 자리를 카카오 지도 중심으로 확정
  function bakePan() {
    if (!map || (!panX && !panY)) return;
    const proj = map.getProjection(), m = $('map');
    m.style.transition = 'none';
    map.setCenter(proj.coordsFromContainerPoint(new kakao.maps.Point(m.clientWidth / 2 + panX, m.clientHeight / 2 + panY)));
    panX = 0; panY = 0;
  }
  // 지도 조각 크기: 어느 방향으로 돌려도 화면이 비지 않을 만큼만(정사각형) 만든다
  function sizeMap() {
    const v = $('view'), vw = v.clientWidth, vh = v.clientHeight;
    const S = Math.ceil(Math.hypot(vw, vh)) + 2 * LIMIT, m = $('map');
    m.style.width = S + 'px'; m.style.height = S + 'px';
    m.style.left = ((vw - S) / 2) + 'px'; m.style.top = ((vh - S) / 2) + 'px';
    if (map) { map.relayout(); if (follow && me) followView(true); }
  }
  window.addEventListener('resize', sizeMap);
  let curAng = 0, disp = null, glideRaf = null;
  function glideTo(lat, lon) {   // 표시 위치를 새 GPS 값까지 0.9초 동안 이동
    if (!disp) { disp = { lat, lon }; return; }
    if (glideRaf) cancelAnimationFrame(glideRaf);
    const from = { lat: disp.lat, lon: disp.lon }, t0 = performance.now();
    const step = (t) => {
      const f = Math.min(1, (t - t0) / 900);
      disp = { lat: from.lat + (lat - from.lat) * f, lon: from.lon + (lon - from.lon) * f };
      const ll = new kakao.maps.LatLng(disp.lat, disp.lon);
      if (meOv) meOv.setPosition(ll);
      glideRaf = f < 1 ? requestAnimationFrame(step) : null;
    };
    glideRaf = requestAnimationFrame(step);
  }

  function startGps() {
    if (SIM) { $('msg').textContent = '시험 모드: 지도를 누르면 그 곳이 내 위치가 됩니다.'; return; }
    if (!navigator.geolocation) { $('msg').textContent = '이 기기는 GPS를 지원하지 않습니다.'; return; }
    const begin = () => {
      if (gpsWatchId != null) { try { navigator.geolocation.clearWatch(gpsWatchId); } catch (e) { } }
      gpsWatchId = navigator.geolocation.watchPosition(
        p => onPos(p.coords.latitude, p.coords.longitude, p.coords.speed != null && p.coords.speed >= 0 ? Math.round(p.coords.speed * 3.6) : null, p.coords.heading),
        e => { if (e.code === 1) $('nextDist').textContent = '위치 권한을 허용해 주세요'; else if (!me) $('nextDist').textContent = 'GPS 신호 찾는 중...'; },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 });
    };
    begin();
    // 위치가 8초 넘게 안 들어오면 GPS 받기를 새로 시작(휴대폰이 조용히 끊는 경우 대비)
    let restartAt = 0;
    setInterval(() => {
      if (document.hidden) return;
      const base = Math.max(lastOwnFix, restartAt);
      if (Date.now() - base > 8000) { restartAt = Date.now(); begin(); }
    }, 3000);
  }

  // 평소에는 내 위치·진행 방향에 고정(끌기 잠금, 확대/축소만 가능). [지도 이동]을 누르면 잠시 자유롭게 끌어 볼 수 있고,
  // 다시 누르거나 손을 뗀 지 10초가 지나면 자동으로 내 위치로 돌아온다
  let panTimer = null;
  function setNav(on) {
    follow = on; headUp = on;
    if (panTimer) { clearTimeout(panTimer); panTimer = null; }
    $('btnPan').textContent = on ? '지도 이동' : '내 위치';   // 같은 버튼: 따라가는 중이면 [지도 이동], 지도를 옮기는 중이면 [내 위치]
    $('btnPan').classList.toggle('on', !on);
    if (map) map.setDraggable(!(on && me));
    if (!on) { bakePan(); applyRotate(); void $('map').offsetWidth; $('map').style.transition = ''; }
    else if (me && map) followView(true);
    else applyRotate();
  }
  function panLater() { if (follow) return; if (panTimer) clearTimeout(panTimer); panTimer = setTimeout(() => setNav(true), 10000); }
  $('btnPan').onclick = () => { if (follow) { setNav(false); panLater(); } else setNav(true); };
  $('route').onchange = () => { me = null; showRoute($('route').value); };

  // 둘째 줄이 숫자 폭 때문에 흔들리지 않게: 시간카운트·오차배지 칸 너비를 가장 넓은 숫자 기준으로 고정(글꼴이 뜬 뒤에 한 번 잰다)
  function lockRowB() {
    const meas = (el, txts) => {
      const c = getComputedStyle(el), sp = document.createElement('span');
      sp.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;padding:0;border:0;';
      sp.style.fontFamily = c.fontFamily; sp.style.fontSize = c.fontSize; sp.style.fontWeight = c.fontWeight; sp.style.fontStyle = c.fontStyle; sp.style.fontVariantNumeric = c.fontVariantNumeric; sp.style.letterSpacing = c.letterSpacing;
      document.body.appendChild(sp); let w = 0;
      txts.forEach(t => { sp.textContent = t; w = Math.max(w, sp.getBoundingClientRect().width); });
      sp.remove(); return Math.ceil(w) + 2;
    };
    try {
      const ds = []; for (let d = 0; d < 10; d++) ds.push(`${d}${d}:${d}${d}:${d}${d}`);   // 숫자마다 폭이 달라도 가장 넓은 값으로 고정
      const tw = meas($('cdTime'), ds) + 'px'; if (parseFloat(tw) < 60) return; $('cdTime').style.minWidth = tw; $('cdTime').style.width = tw;
      const b = $('cdBadge'), cs = getComputedStyle(b);
      b.style.minWidth = Math.max(52, meas(b, ['+88', '-88', '88']) + parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + 4) + 'px';
    } catch (e) { }
  }
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(lockRowB);
  setTimeout(lockRowB, 8000);
  setTimeout(lockRowB, 3000);   // 느린 통신에서 글꼴이 늦게 떠도 한 번 더

  // 처음 켰을 때 안내 배너 (다음부터 알리지 않기를 누르면 다시 안 나옴)
  (function () {
    var off = false; try { off = localStorage.getItem('yb_map_tip_off') === '1'; } catch (e) { }
    if (off) return;
    $('tip').style.display = 'block';
    $('tipClose').onclick = () => { $('tip').style.display = 'none'; };
    $('tipNever').onclick = () => { try { localStorage.setItem('yb_map_tip_off', '1'); } catch (e) { } $('tip').style.display = 'none'; };
  })();

  try { if (window.parent !== window) parent.postMessage({ type: 'rm-ready' }, location.origin); } catch (e) { }
  loadKakao().then(() => {
    map = new kakao.maps.Map($('map'), { center: new kakao.maps.LatLng(37.4563, 126.7052), level: 5 });
    kakao.maps.event.addListener(map, 'dragend', panLater);
    kakao.maps.event.addListener(map, 'zoom_changed', () => { panLater(); if (follow && me) followView(true); });
    sizeMap();
    kakao.maps.event.addListener(map, 'click', (ev) => {
      const l = ev.latLng;
      if (SIM) onPos(l.getLat(), l.getLng(), 30, null);
    });
    showRoute($('route').value);
    if (pendingFix) { const p = pendingFix; pendingFix = null; onPos(p[0], p[1], p[2], p[3], true); }
    startGps();
  }).catch(e => { $('msg').textContent = String(e.message || e); });

  // 거리·이름 글자 크기를 칸 폭에 맞춰 최대한 크게
  function fitText(el, max, min) {
    if (!el) return;
    let s = max; el.style.fontSize = s + 'px';
    const avail = () => el.clientWidth - 8;
    const w = () => { const r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().width; };
    while (s > min && w() > avail()) { s -= 1; el.style.fontSize = s + 'px'; }
  }
  function fitRowA() { fitText($('nextDist'), 44, 18); fitText($('nextName'), 36, 16); }
  { const mo = new MutationObserver(() => { mo.disconnect(); fitRowA(); obs(); }); const obs = () => ['nextDist', 'nextName'].forEach(i => mo.observe($(i), { childList: true, characterData: true, subtree: true })); obs(); fitRowA(); window.addEventListener('resize', fitRowA); setTimeout(fitRowA, 1500); }

  fitText($('cdTime'), 80, 30);
  { const mo2 = new MutationObserver(() => { mo2.disconnect(); fitText($('cdTime'), 80, 30); mo2.observe($('cdTime'), { childList: true, characterData: true, subtree: true }); }); mo2.observe($('cdTime'), { childList: true, characterData: true, subtree: true }); window.addEventListener('resize', () => fitText($('cdTime'), 80, 30)); setTimeout(() => fitText($('cdTime'), 80, 30), 1500); }

  // 오차 숫자에 맞춰 모달과 같은 색 단계로 (라이브 모달 css/live2.css 의 yb3-ok / late / vlate)
  function applyDelayAc(txt) {
    const n = parseInt(String(txt || '').replace('+', ''), 10), a = isNaN(n) ? 0 : Math.abs(n);
    document.body.style.setProperty('--ac', a <= 5 ? '#6EE7B7' : (a <= 10 ? '#FCD34D' : '#FDA4AF'));
  }
</script>
</body>
</html>
