<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>노선 지도</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f172a; color: #e2e8f0; font-family: -apple-system, 'Malgun Gothic', sans-serif; overflow: hidden; }
  #top { position: absolute; top: 0; left: 0; right: 0; z-index: 20; padding: 8px; display: flex; gap: 6px; background: rgba(15,23,42,.92); }
  #top select, #top button { font-size: 15px; padding: 8px 10px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; }
  #top button.on { background: #2563eb; border-color: #2563eb; }
  #top select { flex: 1; min-width: 0; }
  #sim { position: absolute; top: 52px; left: 0; right: 0; z-index: 20; padding: 0 8px 8px; display: flex; gap: 6px; background: rgba(15,23,42,.92); }
  #sim select, #sim button { font-size: 15px; padding: 8px 10px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; }
  #sim button.on { background: #dc2626; border-color: #dc2626; }
  #sim select { flex: 1; min-width: 0; }
  #view { position: absolute; top: 96px; bottom: 0; left: 0; right: 0; overflow: hidden; }
  #map { position: absolute; left: -50%; top: -50%; width: 200%; height: 200%; }
  #card { position: absolute; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); z-index: 20; background: rgba(15,23,42,.94); border-radius: 14px; padding: 12px 14px; box-shadow: 0 2px 12px rgba(0,0,0,.5); }
  #card .lb { font-size: 12px; color: #94a3b8; }
  #card .nm { font-size: 24px; font-weight: 800; margin: 2px 0; }
  #card .ds { font-size: 18px; color: #38bdf8; font-weight: 700; }
  #card .sub { font-size: 13px; color: #94a3b8; margin-top: 4px; }
  #msg { position: absolute; top: 106px; left: 8px; right: 8px; z-index: 20; font-size: 13px; color: #fbbf24; white-space: pre-wrap; }
  #eRow, #eRow2 { display: flex; gap: 6px; margin-top: 8px; }
  #eRow button, #eRow2 button { flex: 1; font-size: 14px; font-weight: 700; padding: 10px 2px; border-radius: 10px; border: 0; background: #334155; color: #fff; }
  #eRow2 button#eLine { background: #dc2626; } #eRow2 button#eVia { background: #2563eb; }
  #card { max-height: 55%; overflow-y: auto; }
  .me { width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: #2563eb; border: 3px solid #fff; box-shadow: 0 0 0 4px rgba(37,99,235,.35); }
  .dot { width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: #fff; border: 2px solid #475569; }
  .dot.past { background: #94a3b8; border-color: #64748b; }
  .dot.next { width: 16px; height: 16px; margin: -8px 0 0 -8px; background: #f59e0b; border-color: #fff; }
  .dot.anchor { background: #ef4444; border-color: #fff; }
</style>
</head>
<body>
<div id="top">
  <select id="route"></select>
  <button id="btnFollow" class="on">따라가기</button>
  <button id="btnHead">방향</button>
  <button id="btnTraffic">교통</button>
</div>
<div id="sim">
  <button id="btnSim">▶ 모의주행</button>
  <button id="btnEdit">✏ 수정</button>
  <select id="simSpeed"><option value="1">실제 속도(40km/h)</option><option value="3">3배</option><option value="8" selected>8배</option><option value="20">20배</option></select>
</div>
<div id="msg"></div>
<div id="view"><div id="map"></div></div>
<div id="card">
  <div class="lb">다음 정류장</div>
  <div class="nm" id="nextName">-</div>
  <div class="ds" id="nextDist">GPS 대기 중</div>
  <div class="sub" id="sub"></div>
  <div id="editBox" style="display:none;margin-top:10px;">
    <div id="editInfo" class="sub" style="white-space:pre-wrap;color:#e2e8f0;"></div>
    <div id="eRow">
      <button id="ePrev">◀ 이전 의심</button><button id="eNext">다음 의심 ▶</button>
    </div>
    <div id="eRow2">
      <button id="eLine">직선으로</button><button id="eVia">지나갈 곳 찍기</button><button id="eReset">원래대로</button>
    </div>
  </div>
</div>

<script src="js/app-config.js"></script>
<script src="js/gas-polyfill.js"></script>
<script src="js/script_std_calc.js"></script>
<script>
  // 카카오 JavaScript 키 (사이트 주소 제한이 걸려 있어 코드에 있어도 안전)
  const KAKAO_JS_KEY = 'e5b58be31dc1470a91e6f354662a32e6';
  const ROUTES = ['202', '202A', '203', '203A', '204', '205', '206', '221', '281', '282'];
  const $ = (id) => document.getElementById(id);
  const SIM = /[?&]sim=1/.test(location.search);   // 책상에서 시험: 지도를 누르면 그 곳이 내 위치

  let map, route = null, segLines = [], dots = [], meOv = null;
  let editMode = false, editSel = null, pendingVia = false;
  let follow = true, headUp = false, traffic = false;
  let me = null, heading = 0, lastMe = null, nextIdx = 0;

  ROUTES.forEach(r => { const o = document.createElement('option'); o.value = o.textContent = r; $('route').appendChild(o); });
  try { const s = localStorage.getItem('yb_map_route'); if (s && ROUTES.includes(s)) $('route').value = s; } catch (e) { }

  function loadKakao() {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + KAKAO_JS_KEY + '&autoload=false';
      s.onload = () => kakao.maps.load(resolve);
      s.onerror = () => reject(new Error('카카오 지도 스크립트를 불러오지 못했습니다 (키 또는 사이트 도메인 등록 확인)'));
      document.head.appendChild(s);
    });
  }

  function distM(la1, lo1, la2, lo2) {
    const R = 6371000, d2r = Math.PI / 180;
    const dla = (la2 - la1) * d2r, dlo = (lo2 - lo1) * d2r;
    const a = Math.sin(dla / 2) ** 2 + Math.cos(la1 * d2r) * Math.cos(la2 * d2r) * Math.sin(dlo / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  function bearing(la1, lo1, la2, lo2) {
    const d2r = Math.PI / 180, y = Math.sin((lo2 - lo1) * d2r) * Math.cos(la2 * d2r);
    const x = Math.cos(la1 * d2r) * Math.sin(la2 * d2r) - Math.sin(la1 * d2r) * Math.cos(la2 * d2r) * Math.cos((lo2 - lo1) * d2r);
    return (Math.atan2(y, x) / d2r + 360) % 360;
  }

  async function showRoute(name) {
    $('msg').textContent = name + ' 노선 불러오는 중...';
    const res = await StdCalc.loadRoute(name);
    if (!res) { $('msg').textContent = '노선을 못 불러왔습니다: ' + (StdCalc.getLastError() || '로그인/네트워크 확인'); return; }
    $('msg').textContent = '';
    try { localStorage.setItem('yb_map_route', name); } catch (e) { }
    route = { name, stops: res.stops.filter(s => s[2] && s[3]), anchors: res.anchors || [] };
    route.prog = 0;
    editSel = null; pendingVia = false;
    segLines.forEach(l => l.setMap(null)); segLines = [];
    dots.forEach(d => d.setMap(null)); dots = [];
    const path = route.stops.map(s => new kakao.maps.LatLng(s[2], s[3]));
    route.segs = route.stops.slice(1).map((x, i) => [[route.stops[i][2], route.stops[i][3]], [x[2], x[3]]]);
    joinPts(route); renderSegs();
    route.stops.forEach((s, i) => {
      const el = document.createElement('div'); el.className = 'dot' + (route.anchors.includes(i) ? ' anchor' : '');
      const ov = new kakao.maps.CustomOverlay({ map, position: path[i], content: el, yAnchor: .5, xAnchor: .5 });
      ov._el = el; dots.push(ov);
    });
    const b = new kakao.maps.LatLngBounds(); path.forEach(p => b.extend(p)); map.setBounds(b);
    update();
    loadRoad(route);
  }


  // ---- 도로를 따라가는 노선선 ----
  // 정류장 좌표를 OSRM(무료 도로 길찾기)에 넣어 정류장 사이(구간)마다 도로 모양을 받아 이 폰에 저장.
  // 정류장에 "도로 오른쪽 가장자리로 접근"(curb)하게 해서 골목으로 돌아 들어가는 현상을 줄임.
  // 그래도 이상한 구간은 [수정] 버튼으로 직선으로 바꾸거나 지나갈 곳을 직접 찍어 고침.
  const ROAD_KEY = 'yb_road_v2_', EDIT_KEY = 'yb_roadedit_v1_';
  const OSRM = 'https://router.project-osrm.org/route/v1/driving/';
  const r5 = (q) => [+q[0].toFixed(5), +q[1].toFixed(5)];
  function segLen(seg) { let d = 0; for (let i = 1; i < seg.length; i++) d += distM(seg[i - 1][0], seg[i - 1][1], seg[i][0], seg[i][1]); return d; }
  function segSuspect(i) {
    const st = route.stops, a = st[i], b = st[i + 1];
    const straight = distM(a[2], a[3], b[2], b[3]), len = segLen(route.segs[i]);
    return len > straight * 1.8 && len - straight > 150;
  }
  function suspects() { return route.segs.map((x, i) => i).filter(i => segSuspect(i) && !(route.edits && route.edits[i])); }

  function joinPts(r) {
    const pts = [], at = [];
    r.segs.forEach((seg, i) => { at.push(pts.length); pts.push(...(i ? seg.slice(1) : seg)); });
    at.push(pts.length - 1);
    r.pts = pts; r.stopAt = at;
    if (r === route && simTimer) simBuild();
  }

  function renderSegs() {
    segLines.forEach(l => l.setMap(null)); segLines = [];
    route.segs.forEach((seg, i) => {
      const edited = route.edits && route.edits[i];
      const sus = editMode && segSuspect(i) && !edited;
      const sel = editMode && editSel === i;
      const line = new kakao.maps.Polyline({
        map, path: seg.map(q => new kakao.maps.LatLng(q[0], q[1])),
        strokeWeight: sel ? 9 : (editMode ? 7 : 5),
        strokeColor: sel ? '#f59e0b' : sus ? '#ef4444' : edited && editMode ? '#16a34a' : '#2563eb',
        strokeOpacity: sel ? .9 : sus ? .75 : .4
      });
      kakao.maps.event.addListener(line, 'click', () => { if (editMode) selectSeg(i); });
      segLines.push(line);
    });
  }

  async function osrmLegs(coords) {   // coords: [[lat,lng],...] → 구간별 점 목록(실패 시 null)
    const pathStr = coords.map(c => c[1] + ',' + c[0]).join(';');
    const tails = ['&approaches=' + coords.map(() => 'curb').join(';'), ''];   // curb 실패 시 일반 방식 재시도
    for (const tail of tails) {
      try {
        const res = await (await fetch(OSRM + pathStr + '?overview=false&geometries=geojson&steps=true&continue_straight=true' + tail)).json();
        if (res.routes && res.routes[0] && res.routes[0].legs.length === coords.length - 1) {
          return res.routes[0].legs.map(leg => {
            const out = [];
            leg.steps.forEach(stp => stp.geometry.coordinates.forEach(c => { const q = [c[1], c[0]]; const l = out[out.length - 1]; if (!l || l[0] !== q[0] || l[1] !== q[1]) out.push(q); }));
            return out.map(r5);
          });
        }
      } catch (e) { }
    }
    return null;
  }

  function readEdits(r) { try { return JSON.parse(localStorage.getItem(EDIT_KEY + r.name)) || {}; } catch (e) { return {}; } }
  function saveEdits(r) { try { localStorage.setItem(EDIT_KEY + r.name, JSON.stringify(r.edits)); } catch (e) { } }

  async function applyEdit(r, i) {   // 한 구간에 수정 내용 적용 (원래대로면 base 사용)
    const e = r.edits[i], a = [r.stops[i][2], r.stops[i][3]], b = [r.stops[i + 1][2], r.stops[i + 1][3]];
    if (!e) { r.segs[i] = r.base[i]; return; }
    if (e === 'line') { r.segs[i] = [a, b]; return; }
    const legs = await osrmLegs([a, e.via, b]);
    r.segs[i] = legs ? legs[0].concat(legs[1].slice(1)) : [a, e.via, b];
  }

  async function loadRoad(r) {
    r.edits = readEdits(r);
    let base = null;
    try {
      const o = JSON.parse(localStorage.getItem(ROAD_KEY + r.name));
      if (o && o.n === r.stops.length && o.segs && o.segs.length === r.stops.length - 1) base = o.segs;
    } catch (e) { }
    if (!base) {
      const st = r.stops, CH = 20; base = []; let fail = 0;
      for (let a = 0; a < st.length - 1; a += CH - 1) {
        if (r !== route) return;                       // 노선을 바꿨으면 중단
        $('msg').textContent = `${r.name} 도로선 만드는 중... ${Math.min(100, Math.round(a / st.length * 100))}%`;
        const part = st.slice(a, Math.min(st.length, a + CH)).map(x => [x[2], x[3]]);
        const legs = await osrmLegs(part);
        if (legs) base.push(...legs); else { fail++; for (let k = 1; k < part.length; k++) base.push([part[k - 1], part[k]]); }
      }
      if (r !== route) return;
      $('msg').textContent = fail ? `도로선 일부(${fail}덩어리)는 직선으로 표시됩니다.` : '';
      if (!fail) { try { localStorage.setItem(ROAD_KEY + r.name, JSON.stringify({ n: st.length, segs: base })); } catch (e) { } }
    }
    r.base = base; r.segs = base.slice();
    for (const k of Object.keys(r.edits)) { await applyEdit(r, +k); if (r !== route) return; }
    joinPts(r); renderSegs(); updateEditInfo();
  }

  // ---- 수정 화면 ----
  function updateEditInfo() {
    if (!editMode || !route || !route.segs) return;
    const sus = suspects();
    const ed = Object.keys(route.edits || {}).length;
    let t = `의심 구간(빨강) ${sus.length}개 · 수정함(초록) ${ed}개`;
    if (editSel != null) {
      const a = route.stops[editSel], b = route.stops[editSel + 1];
      const len = segLen(route.segs[editSel]), straight = distM(a[2], a[3], b[2], b[3]);
      t = `${a[1]} → ${b[1]}\\n도로선 ${Math.round(len)}m / 직선 ${Math.round(straight)}m (${(len / Math.max(straight, 1)).toFixed(1)}배)` + (pendingVia ? '\\n▶ 지도에서 지나갈 곳을 한 번 누르세요' : '');
    } else t += '\\n선(구간)을 눌러 고르세요';
    $('editInfo').textContent = t.replace(/\\n/g, '\n');
  }
  function selectSeg(i) {
    editSel = i; pendingVia = false; renderSegs(); updateEditInfo();
    const a = route.stops[i], b = route.stops[i + 1];
    map.setCenter(new kakao.maps.LatLng((a[2] + b[2]) / 2, (a[3] + b[3]) / 2));
  }
  async function editAction(kind) {
    if (editSel == null) { $('msg').textContent = '먼저 고칠 구간(선)을 누르세요.'; return; }
    $('msg').textContent = '';
    const i = editSel;
    if (kind === 'line') route.edits[i] = 'line';
    else if (kind === 'reset') delete route.edits[i];
    else if (kind === 'via') { pendingVia = true; updateEditInfo(); return; }
    saveEdits(route); await applyEdit(route, i); joinPts(route); renderSegs(); updateEditInfo();
  }
  async function placeVia(latlng) {
    pendingVia = false;
    route.edits[editSel] = { via: [+latlng.getLat().toFixed(5), +latlng.getLng().toFixed(5)] };
    $('msg').textContent = '다시 계산 중...';
    saveEdits(route); await applyEdit(route, editSel); joinPts(route); renderSegs(); updateEditInfo();
    $('msg').textContent = '';
  }
  function jumpSuspect(dir) {
    const sus = suspects(); if (!sus.length) { $('msg').textContent = '의심 구간이 없습니다.'; return; }
    let k = dir > 0 ? sus.find(x => x > (editSel == null ? -1 : editSel)) : [...sus].reverse().find(x => x < (editSel == null ? 1e9 : editSel));
    if (k == null) k = dir > 0 ? sus[0] : sus[sus.length - 1];
    selectSeg(k);
  }
  $('btnEdit').onclick = () => {
    editMode = !editMode; $('btnEdit').classList.toggle('on', editMode);
    $('editBox').style.display = editMode ? 'block' : 'none';
    if (editMode) { follow = false; $('btnFollow').classList.remove('on'); } else { editSel = null; pendingVia = false; }
    if (route && route.segs) { renderSegs(); updateEditInfo(); }
  };
  $('eLine').onclick = () => editAction('line');
  $('eVia').onclick = () => editAction('via');
  $('eReset').onclick = () => editAction('reset');
  $('ePrev').onclick = () => jumpSuspect(-1);
  $('eNext').onclick = () => jumpSuspect(1);

  // 내 위치로 다음 정류장 찾기
  function update() {
    if (!route || !me) return;
    const st = route.stops;
    let best = 0, bd = 1e12;
    // 지나온 곳보다 뒤로 크게 돌아가지 않게, 현재 진행 지점 근처부터 우선 탐색
    const from = Math.max(0, route.prog - 2), to = Math.min(st.length - 1, route.prog + 12);
    for (let i = from; i <= to; i++) { const d = distM(me.lat, me.lon, st[i][2], st[i][3]); if (d < bd) { bd = d; best = i; } }
    if (bd > 400) { // 근처에 없으면 전체에서 다시 찾음 (노선 이탈 후 복귀 등)
      for (let i = 0; i < st.length; i++) { const d = distM(me.lat, me.lon, st[i][2], st[i][3]); if (d < bd) { bd = d; best = i; } }
    }
    let next = best;
    if (best < st.length - 1) {
      const a = st[best], b = st[best + 1];
      const ux = b[3] - a[3], uy = b[2] - a[2], vx = me.lon - a[3], vy = me.lat - a[2];
      if (ux * vx + uy * vy > 0 || bd < 25) next = best + 1;   // 이미 지났거나 25m 이내면 다음 정류장
    }
    route.prog = Math.max(0, next - 1);
    nextIdx = next;
    const s = st[next];
    const d = distM(me.lat, me.lon, s[2], s[3]);
    $('nextName').textContent = s[1];
    $('nextDist').textContent = d >= 1000 ? (d / 1000).toFixed(1) + ' km' : Math.round(d) + ' m';
    $('sub').textContent = `${route.name}  ·  ${next + 1} / ${st.length}번째 정류장` + (me.speed != null ? `  ·  ${me.speed} km/h` : '');
    dots.forEach((ov, i) => { ov._el.className = 'dot' + (route.anchors.includes(i) ? ' anchor' : '') + (i < next ? ' past' : '') + (i === next ? ' next' : ''); });
  }

  function onPos(lat, lon, speedKmh, hd, fromSim) {
    if (simTimer && !fromSim) return;
    const prev = me;
    me = { lat, lon, speed: speedKmh };
    if (hd != null && !isNaN(hd) && (speedKmh == null || speedKmh > 3)) heading = hd;
    else if (prev && distM(prev.lat, prev.lon, lat, lon) > 5) heading = bearing(prev.lat, prev.lon, lat, lon);
    const ll = new kakao.maps.LatLng(lat, lon);
    if (!meOv) { const el = document.createElement('div'); el.className = 'me'; meOv = new kakao.maps.CustomOverlay({ map, position: ll, content: el, zIndex: 9 }); }
    meOv.setPosition(ll);
    if (follow) { map.setCenter(ll); }
    applyRotate();
    update();
  }

  function applyRotate() {
    $('map').style.transform = headUp ? `rotate(${-heading}deg)` : '';
  }

  function startGps() {
    if (SIM) { $('msg').textContent = '시험 모드: 지도를 누르면 그 곳이 내 위치가 됩니다.'; return; }
    if (!navigator.geolocation) { $('msg').textContent = '이 기기는 GPS를 지원하지 않습니다.'; return; }
    navigator.geolocation.watchPosition(
      p => onPos(p.coords.latitude, p.coords.longitude, p.coords.speed != null && p.coords.speed >= 0 ? Math.round(p.coords.speed * 3.6) : null, p.coords.heading),
      e => { $('nextDist').textContent = e.code === 1 ? '위치 권한을 허용해 주세요' : 'GPS 신호 찾는 중...'; },
      { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 });
  }

  $('btnFollow').onclick = () => { follow = !follow; $('btnFollow').classList.toggle('on', follow); if (follow && me) map.setCenter(new kakao.maps.LatLng(me.lat, me.lon)); };
  $('btnHead').onclick = () => { headUp = !headUp; $('btnHead').classList.toggle('on', headUp); applyRotate(); };
  $('btnTraffic').onclick = () => {
    traffic = !traffic; $('btnTraffic').classList.toggle('on', traffic);
    if (traffic) map.addOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC); else map.removeOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC);
  };
  // ---- 모의주행: 노선선을 따라 가짜 GPS가 움직임 (책상에서 시험용) ----
  let simTimer = null, simDist = 0, simCum = null;
  function simBuild() {
    const P = route.pts; simCum = [0];
    for (let i = 1; i < P.length; i++) simCum.push(simCum[i - 1] + distM(P[i - 1][0], P[i - 1][1], P[i][0], P[i][1]));
  }
  function simPoint(d) {
    const P = route.pts; let i = 1;
    while (i < P.length - 1 && simCum[i] < d) i++;
    const seg = simCum[i] - simCum[i - 1] || 1, f = Math.min(1, Math.max(0, (d - simCum[i - 1]) / seg));
    return [P[i - 1][0] + (P[i][0] - P[i - 1][0]) * f, P[i - 1][1] + (P[i][1] - P[i - 1][1]) * f];
  }
  function simStop() { if (simTimer) clearInterval(simTimer); simTimer = null; $('btnSim').classList.remove('on'); $('btnSim').textContent = '▶ 모의주행'; }
  $('btnSim').onclick = () => {
    if (simTimer) { simStop(); return; }
    if (!route) return;
    simBuild(); if (simDist >= simCum[simCum.length - 1]) simDist = 0;
    $('btnSim').classList.add('on'); $('btnSim').textContent = '■ 멈춤';
    follow = true; $('btnFollow').classList.add('on');
    simTimer = setInterval(() => {
      const mult = +$('simSpeed').value;
      simDist += (40 / 3.6) * mult;
      if (simDist >= simCum[simCum.length - 1]) { simStop(); return; }
      const p = simPoint(simDist);
      onPos(p[0], p[1], 40, null, true);
    }, 1000);
  };
  $('route').onchange = () => { simStop(); simDist = 0; me = null; showRoute($('route').value); };

  loadKakao().then(() => {
    map = new kakao.maps.Map($('map'), { center: new kakao.maps.LatLng(37.4563, 126.7052), level: 5 });
    kakao.maps.event.addListener(map, 'dragstart', () => { if (follow) { follow = false; $('btnFollow').classList.remove('on'); } });
    kakao.maps.event.addListener(map, 'click', (ev) => {
      const l = ev.latLng;
      if (editMode && pendingVia && editSel != null) { placeVia(l); return; }
      if (simTimer && route) {   // 모의주행 중: 누른 곳에서 가장 가까운 정류장으로 건너뜀
        let bi = 0, bd = 1e12;
        route.stops.forEach((x, i) => { const d = distM(l.getLat(), l.getLng(), x[2], x[3]); if (d < bd) { bd = d; bi = i; } });
        simDist = simCum[route.stopAt[bi]]; route.prog = Math.max(0, bi - 1);
      } else if (SIM) onPos(l.getLat(), l.getLng(), 30, null);
    });
    showRoute($('route').value);
    startGps();
  }).catch(e => { $('msg').textContent = String(e.message || e); });
</script>
</body>
</html>
