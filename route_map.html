<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>노선 지도</title>
<style>
  :root { --sat: max(env(safe-area-inset-top), 40px); }   /* 폰 맨 위 상태표시줄 아래로 내림 */
  html, body { margin: 0; height: 100%; background: #0f172a; color: #e2e8f0; font-family: -apple-system, 'Malgun Gothic', sans-serif; overflow: hidden; }
  #top { position: absolute; top: 0; left: 0; right: 0; z-index: 20; padding: 8px; padding-top: calc(8px + var(--sat)); display: flex; gap: 6px; background: rgba(15,23,42,.92); }
  #top select, #top button { font-size: 15px; padding: 8px 10px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; }
  #top button.on { background: #2563eb; border-color: #2563eb; }
  #top select { flex: 1; min-width: 0; }
  #sim { position: absolute; top: calc(52px + var(--sat)); left: 0; right: 0; z-index: 20; padding: 0 8px 8px; display: flex; gap: 6px; background: rgba(15,23,42,.92); }
  #sim select, #sim button { font-size: 15px; padding: 8px 10px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; }
  #sim button.on { background: #dc2626; border-color: #dc2626; }
  #sim select { flex: 1; min-width: 0; }
  #rot { display: none; position: fixed; inset: 0; z-index: 99; background: #0f172a; color: #fff; font-size: 20px; font-weight: 800; align-items: center; justify-content: center; }
  @media (orientation: landscape) and (max-height: 520px) { #rot { display: flex; } }
  body.nonadmin #sim { display: none; }
  body.nonadmin #view { top: calc(52px + var(--sat)); }
  body.nonadmin #msg { top: calc(62px + var(--sat)); }
  #view { position: absolute; top: calc(96px + var(--sat)); bottom: 0; left: 0; right: 0; overflow: hidden; }
  #map { position: absolute; left: -50%; top: -50%; width: 200%; height: 200%; transition: transform .9s linear; will-change: transform; transform-origin: 50% 50%; }
  #card { position: absolute; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); z-index: 20; background: rgba(15,23,42,.62); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border: 1.5px solid rgba(56,189,248,.5); box-shadow: 0 4px 18px rgba(0,0,0,.55); text-shadow: 0 1px 3px rgba(0,0,0,.95), 0 0 8px rgba(0,0,0,.75); border-radius: 14px; padding: 10px 14px; }
  #card .lb { font-size: 12px; color: #94a3b8; }
  #rowA { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 1fr); align-items: center; column-gap: 8px; min-height: 30px; }
  #card .nm { font-size: 24px; line-height: 30px; font-weight: 800; margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #card .ds { font-size: 24px; line-height: 30px; color: #38bdf8; font-weight: 800; white-space: nowrap; overflow: visible; font-variant-numeric: tabular-nums; }
  #rowB { display: flex; align-items: center; gap: 10px; margin-top: 12px; min-height: 40px; }
  #cdTime { font-size: 30px !important; flex: 0 0 auto; }
  #card .big { font-size: 24px; font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #cdBadge { min-width: 52px; text-align: center; padding: 2px 10px; border-radius: 12px; border: 2px solid #34c759; background: rgba(52,199,89,.15); color: #34c759; }
  #anchorName { flex: 1 1 0; min-width: 0; font-size: 18px; font-weight: 700; color: #fed7aa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body.standalone #cdTime, body.standalone #cdBadge { display: none; }
  #card .sub { font-size: 13px; color: #94a3b8; margin-top: 4px; }
  #msg { position: absolute; top: calc(106px + var(--sat)); left: 8px; right: 8px; z-index: 20; font-size: 13px; color: #fbbf24; white-space: pre-wrap; }
  #eRow, #eRow2 { display: flex; gap: 6px; margin-top: 8px; }
  #eRow button, #eRow2 button { flex: 1; font-size: 14px; font-weight: 700; padding: 10px 2px; border-radius: 10px; border: 0; background: #334155; color: #fff; }
  #eRow3 { display: flex; gap: 6px; margin-top: 8px; }
  #eDel.act { background: #dc2626 !important; }
  #eRow3 { flex-wrap: wrap; }
  #eRow3 button { flex: 1; font-size: 13px; font-weight: 700; padding: 9px 2px; border-radius: 10px; border: 0; background: #1e293b; color: #cbd5e1; }
  #eRow button, #eRow2 button { font-size: 15px; padding: 13px 2px; }
  #eVia { background: #2563eb !important; } #eVia.act, #eOnly.act { background: #f59e0b !important; color: #111 !important; }
  .tag { padding: 3px 8px; border-radius: 8px; font-size: 13px; font-weight: 800; color: #fff; white-space: nowrap; border: 2px solid #fff; }
  .tag.ta { background: #16a34a; } .tag.tb { background: #dc2626; }
  .via { width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: #f59e0b; color: #111; font-size: 12px; font-weight: 800; text-align: center; line-height: 22px; border: 2px solid #fff; }
  #card { max-height: 55%; overflow: visible; }
  #card.ed { overflow-y: auto; }
  .mebus { width: 50px; height: 50px; margin: -25px 0 0 -25px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); transition: transform .3s linear; }
  .mebus svg { width: 100%; height: 100%; display: block; }
  .me { width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: #2563eb; border: 3px solid #fff; box-shadow: 0 0 0 4px rgba(37,99,235,.35); }
  .dot { width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: #fff; border: 2px solid #475569; }
  .dot.past { background: #94a3b8; border-color: #64748b; }
  .ring { width: 32px; height: 32px; border-radius: 50%; border: 3px solid rgba(239,68,68,.8); box-sizing: border-box; pointer-events: none; }   /* 다음 정류장: 속이 빈 빨간 테두리 원 */
  .dot.anchor { background: #ef4444; border-color: #fff; }
</style>
</head>
<body>
<div id="rot">폰을 세로로 돌려 주세요</div>
<div id="top">
  <button id="btnBack" onclick="if (window.parent !== window) parent.postMessage({ type: 'rm-close' }, location.origin); else location.href = 'index.html';">← 앱</button>
  <select id="route"></select>
  <button id="btnPan"><svg viewBox="0 0 24 24" width="18" height="18" style="vertical-align:-3px;margin-right:4px" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4"/></svg>지도 이동</button>
</div>
<div id="sim">
  <button id="btnSim">▶ 모의주행</button>
  <button id="btnEdit">✏ 수정</button>
  <select id="simSpeed"><option value="1">실제 속도(40km/h)</option><option value="3">3배</option><option value="8" selected>8배</option><option value="20">20배</option></select>
</div>
<div id="msg"></div>
<div id="view"><div id="map"></div></div>
<div id="card">
  <div id="rowA"><span class="nm" id="nextName">-</span><span class="ds" id="nextDist">GPS 대기 중</span></div>
  <div id="rowB">
    <span id="cdTime" class="big">--:--:--</span>
    <span id="cdBadge" class="big badge">0</span>
    <span id="anchorName"></span>
  </div>
  <div class="sub" id="sub" style="display:none"></div>
  <div id="editBox" style="display:none;margin-top:10px;">
    <div id="eHead" style="font-size:20px;font-weight:800;"></div>
    <div id="eName" style="font-size:17px;font-weight:700;margin-top:2px;"></div>
    <div id="eDir" class="sub" style="color:#38bdf8;font-weight:700;"></div>
    <div id="eStat" class="sub" style="white-space:pre-wrap;color:#e2e8f0;"></div>
    <div id="eSaved" class="sub" style="color:#4ade80;"></div>
    <div id="eRow">
      <button id="ePrev">◀ 이전</button><button id="eNext" style="background:#16a34a;">✔ 맞아요, 다음 ▶</button>
    </div>
    <div id="eRow2">
      <button id="eUndo">↩ 되돌리기</button><button id="eDel">🗑 지우기: 꺼짐</button><button id="eReset">원래대로</button>
    </div>
    <div id="eRow3">
      <button id="eThin">✨ 점 줄이기</button><button id="eClear">🧹 점 전부 지우기</button><button id="eFirst">⏮ 처음(출발)부터</button><button id="eOnly">의심 구간만: 꺼짐</button><button id="eSave">📥 노선 저장 파일 받기</button><button id="eCopy">📋 수정내용 복사</button>
    </div>
  </div>
</div>

<script src="js/app-config.js"></script>
<script src="js/gas-polyfill.js"></script>
<script src="js/script_std_calc.js"></script>
<script>
  // 카카오 JavaScript 키 (사이트 주소 제한이 걸려 있어 코드에 있어도 안전)
  const KAKAO_JS_KEY = 'e5b58be31dc1470a91e6f354662a32e6';
  const ROUTES = ['202', '202A', '203', '203A', '204', '205', '206', '221', '281', '282'];
  const $ = (id) => document.getElementById(id);
  const EMBED = /[?&]embed=1/.test(location.search);
  if (!EMBED) document.body.classList.add('standalone');
  const SIM = /[?&]sim=1/.test(location.search);   // 책상에서 시험: 지도를 누르면 그 곳이 내 위치

  let map, route = null, segLines = [], dots = [], meOv = null, ringOv = null;
  let editMode = false, editSel = null, pendingVia = false;
  let follow = true, headUp = true, traffic = false;   // 켜면 처음부터 [따라가기]·[방향] 선택됨
  let me = null, heading = 0, lastMe = null, nextIdx = 0;

  try { screen.orientation.lock('portrait').catch(() => { }); } catch (e) { }   // 세로 고정(설치형 앱에서 동작, 안 되면 가로일 때 안내 화면)
  let isAdmin = false;
  // 오류가 나면 관리자 화면 위쪽 글자 줄에 보여 준다(원인 찾기용)
  function showErr(m) { try { if (isAdmin || /[?&]debug=1/.test(location.search)) $('msg').textContent = '오류: ' + m; } catch (e) { } }
  window.addEventListener('error', e => showErr(e.message + (e.lineno ? ' (줄 ' + e.lineno + ')' : '')));
  window.addEventListener('unhandledrejection', e => showErr(String(e.reason && e.reason.message || e.reason)));
  // 모의주행·수정은 관리자(유재필)에게만 보인다 (수정 내용은 어차피 그 폰에만 저장됨)
  (function () {
    var nm = '';
    try { var u = JSON.parse(localStorage.getItem('yeongjong_logged_user') || 'null'); if (u && u.name) nm = u.name; } catch (e) { }
    if (!nm) { try { nm = localStorage.getItem('loggedInUser') || ''; } catch (e) { } }
    if (String(nm).indexOf('유재필') === -1) document.body.classList.add('nonadmin'); else isAdmin = true;
  })();

  ROUTES.forEach(r => { const o = document.createElement('option'); o.value = o.textContent = r; $('route').appendChild(o); });
  try { const s = localStorage.getItem('yb_map_route'); if (s && ROUTES.includes(s)) $('route').value = s; } catch (e) { }
  try { const q = new URLSearchParams(location.search).get('route'); if (q && ROUTES.includes(q)) $('route').value = q; } catch (e) { }   // 앱의 [노선지도] 버튼: 오늘 근무 노선

  function loadKakao() {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + KAKAO_JS_KEY + '&autoload=false';
      s.onload = () => kakao.maps.load(resolve);
      s.onerror = () => reject(new Error('카카오 지도 스크립트를 불러오지 못했습니다 (키 또는 사이트 도메인 등록 확인)'));
      document.head.appendChild(s);
    });
  }

  function distM(la1, lo1, la2, lo2) {
    const R = 6371000, d2r = Math.PI / 180;
    const dla = (la2 - la1) * d2r, dlo = (lo2 - lo1) * d2r;
    const a = Math.sin(dla / 2) ** 2 + Math.cos(la1 * d2r) * Math.cos(la2 * d2r) * Math.sin(dlo / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  function bearing(la1, lo1, la2, lo2) {
    const d2r = Math.PI / 180, y = Math.sin((lo2 - lo1) * d2r) * Math.cos(la2 * d2r);
    const x = Math.cos(la1 * d2r) * Math.sin(la2 * d2r) - Math.sin(la1 * d2r) * Math.cos(la2 * d2r) * Math.cos((lo2 - lo1) * d2r);
    return (Math.atan2(y, x) / d2r + 360) % 360;
  }

  async function showRoute(name) {
    $('msg').textContent = name + ' 노선 불러오는 중...';
    const res = await StdCalc.loadRoute(name);
    if (!res) { $('msg').textContent = '노선을 못 불러왔습니다: ' + (StdCalc.getLastError() || '로그인/네트워크 확인'); return; }
    $('msg').textContent = '';
    try { localStorage.setItem('yb_map_route', name); } catch (e) { }
    route = { name, stops: res.stops.filter(s => s[2] && s[3]), anchors: res.anchors || [] };
    route.prog = 0; route.leg = legOf(1);
    editSel = null; pendingVia = false;
    segLines.forEach(l => l.setMap(null)); segLines = [];
    dots.forEach(d => d.setMap(null)); dots = [];
    if (ringOv) { ringOv.setMap(null); ringOv = null; }
    const path = route.stops.map(s => new kakao.maps.LatLng(s[2], s[3]));
    route.segs = route.stops.slice(1).map((x, i) => [[route.stops[i][2], route.stops[i][3]], [x[2], x[3]]]);
    joinPts(route); renderSegs();
    route.stops.forEach((s, i) => {
      const el = document.createElement('div'); el.className = 'dot' + (route.anchors.includes(i) ? ' anchor' : '');
      const ov = new kakao.maps.CustomOverlay({ map, position: path[i], content: el, yAnchor: .5, xAnchor: .5 });
      ov._el = el; dots.push(ov);
    });
    applyLegDots();
    const b = new kakao.maps.LatLngBounds(); path.forEach((p, i) => { if (!route.leg || (i >= route.leg[0] && i <= route.leg[1])) b.extend(p); }); map.setBounds(b);
    update();
    loadRoad(route);
  }


  // ---- 도로를 따라가는 노선선 ----
  // 정류장 좌표를 OSRM(무료 도로 길찾기)에 넣어 정류장 사이(구간)마다 도로 모양을 받아 이 폰에 저장.
  // 정류장에 "도로 오른쪽 가장자리로 접근"(curb)하게 해서 골목으로 돌아 들어가는 현상을 줄임.
  // 그래도 이상한 구간은 [수정] 버튼으로 직선으로 바꾸거나 지나갈 곳을 직접 찍어 고침.
  const ROAD_KEY = 'yb_road_v2_', EDIT_KEY = 'yb_roadedit_v2_';
  const OSRM = 'https://router.project-osrm.org/route/v1/driving/';
  const r5 = (q) => [+q[0].toFixed(5), +q[1].toFixed(5)];
  let onlySus = false, viaMarks = [], endMarks = [];
  function segLen(seg) { let d = 0; for (let i = 1; i < seg.length; i++) d += distM(seg[i - 1][0], seg[i - 1][1], seg[i][0], seg[i][1]); return d; }
  function segStraight(i) { const a = route.stops[i], b = route.stops[i + 1]; return distM(a[2], a[3], b[2], b[3]); }
  function segSuspect(i) { const st = segStraight(i), len = segLen(route.segs[i]); return len > st * 1.8 && len - st > 150; }
  
  function joinPts(r) {
    const pts = [], at = [];
    r.segs.forEach((seg, i) => { at.push(pts.length); pts.push(...(i ? seg.slice(1) : seg)); });
    at.push(pts.length - 1);
    r.pts = pts; r.stopAt = at;
    if (r === route && simTimer) simBuild();
  }

  function renderSegs() {
    segLines.forEach(l => l.setMap(null)); segLines = [];
    viaMarks.forEach(m => m.setMap(null)); viaMarks = [];
    endMarks.forEach(m => m.setMap(null)); endMarks = [];
    if (!editMode) {   // 평소 보기: 전체를 선 한 줄로 그려서 겹친 곳(상·하행)도 투명도가 똑같게
      const all = [], lg = route.leg; route.segs.forEach((sg, i) => { if (!lg || (i >= lg[0] && i < lg[1])) sg.forEach(q => all.push(new kakao.maps.LatLng(q[0], q[1]))); });
      segLines.push(new kakao.maps.Polyline({ map, path: all, strokeWeight: 5, strokeColor: '#2563eb', strokeOpacity: .5, zIndex: 1 }));
      return;
    }
    route.segs.forEach((seg, i) => {
      const sel = editMode && editSel === i;
      const path = seg.map(q => new kakao.maps.LatLng(q[0], q[1]));
      const line = new kakao.maps.Polyline({
        map, path,
        strokeWeight: sel ? 10 : 5,
        strokeColor: sel ? '#f59e0b' : (editMode && route.ok && route.ok[i]) ? '#16a34a' : '#2563eb',
        strokeOpacity: sel ? .95 : editMode ? .3 : .4,
        endArrow: sel, zIndex: sel ? 5 : 1
      });
      kakao.maps.event.addListener(line, 'click', (ev) => { if (!editMode) return; if (i === editSel && ev && ev.latLng) insertPoint(i, ev.latLng); else selectSeg(i); });
      segLines.push(line);
    });
    if (editMode && editSel != null) {
      const a = route.stops[editSel], b = route.stops[editSel + 1];
      const tag = (txt, cls, la, lo) => { const el = document.createElement('div'); el.className = 'tag ' + cls; el.textContent = txt; endMarks.push(new kakao.maps.CustomOverlay({ map, position: new kakao.maps.LatLng(la, lo), content: el, yAnchor: 1.3, zIndex: 8 })); };
      tag('출발 ' + a[1], 'ta', a[2], a[3]);
      tag('도착 ' + b[1], 'tb', b[2], b[3]);
      const P = handlePts(editSel), si = editSel;
      if (!delImgObj) { delImgObj = circleImg('#dc2626', 34); delSelImgObj = circleImg('#7f1d1d', 40); }
      P.forEach((v, k) => {
        if (k === 0 || k === P.length - 1) return;   // 정류장 두 곳은 고정
        const img = delMode ? (delFirst === k ? delSelImgObj : delImgObj) : handleImg();
        const mk = new kakao.maps.Marker({ map, position: new kakao.maps.LatLng(v[0], v[1]), draggable: !delMode, image: img, zIndex: delFirst === k ? 11 : 9 });
        kakao.maps.event.addListener(mk, 'dragend', () => { lastDrag = Date.now(); const q = mk.getPosition(); moveAnchor(si, k, [q.getLat(), q.getLng()]); });
        kakao.maps.event.addListener(mk, 'click', () => {
          if (!delMode || Date.now() - lastDrag < 400) return;
          if (delFirst == null) { delFirst = k; renderSegs(); updateEditInfo(); }          // 첫 번째 점 선택(진한 빨강)
          else { const f = delFirst; delFirst = null; deleteRange(si, f, k); }               // 두 번째 점: 둘 사이 전부 삭제 (같은 점이면 그 점만)
        });
        viaMarks.push(mk);
      });
    }
  }

  async function osrmLegs(coords, noCurb) {   // coords: [[lat,lng],...] → 구간별 점 목록(실패 시 null)
    const pathStr = coords.map(c => c[1] + ',' + c[0]).join(';');
    const tails = noCurb ? [''] : ['&approaches=' + coords.map(() => 'curb').join(';'), ''];   // curb 실패 시 일반 방식 재시도
    for (const tail of tails) {
      try {
        const res = await (await fetch(OSRM + pathStr + '?overview=false&geometries=geojson&steps=true&continue_straight=true' + tail)).json();
        if (res.routes && res.routes[0] && res.routes[0].legs.length === coords.length - 1) {
          return res.routes[0].legs.map(leg => {
            const out = [];
            leg.steps.forEach(stp => stp.geometry.coordinates.forEach(c => { const q = [c[1], c[0]]; const l = out[out.length - 1]; if (!l || l[0] !== q[0] || l[1] !== q[1]) out.push(q); }));
            return out.map(r5);
          });
        }
      } catch (e) { }
    }
    return null;
  }

  function readEdits(r) {
    try { const o = JSON.parse(localStorage.getItem(EDIT_KEY + r.name)); if (o) { r.edits = {}; r.ok = o.ok || {}; if (o.t && r.ghSavedAt && r.ghSavedAt > o.t) return;   /* 이미 GitHub 파일에 반영된 수정 */ Object.keys(o.edits || {}).forEach(k => { if (o.edits[k] && o.edits[k].anc && o.edits[k].geo) r.edits[k] = o.edits[k]; }); return; } } catch (e) { }

    const anc = (route.anchors || []).slice().sort((x, y) => x - y).find(a => a > 0 && a >= next);
    $('anchorName').textContent = st[anc != null ? anc : st.length - 1][1];
    $('sub').textContent = `${route.name}  ·  ${next + 1} / ${st.length}번째 정류장` + (me.speed != null ? `  ·  ${me.speed} km/h` : '');
    dots.forEach((ov, i) => { ov._el.className = 'dot' + (route.anchors.includes(i) ? ' anchor' : '') + (i < next ? ' past' : '') + (i === next ? ' next' : ''); });
  }

  // 내 위치 = 파란 원 + 앞쪽 화살표. 화살표가 가는 방향
  const BUS_SVG = '<svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg" overflow="visible">'
    + '<circle cx="22" cy="22" r="19" fill="#2563eb" fill-opacity=".25"/>'
    + '<path d="M22 -6 L33 10 L11 10 Z" fill="#2563eb" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/>'
    + '<circle cx="22" cy="22" r="11" fill="#2563eb" stroke="#fff" stroke-width="3.4"/></svg>';

  // 앱(부모 화면)이 1초마다 보내 주는 시간카운트·오차배지를 표시
  window.addEventListener('message', (ev) => {
    if (ev.origin !== location.origin || !ev.data || ev.data.type !== 'rm-live') return;
    const d = ev.data;
    if (d.time) $('cdTime').textContent = d.time;
    const bd = $('cdBadge'); bd.textContent = d.delay || '0';
    if (d.dc) { bd.style.color = d.dc; bd.style.background = d.db; bd.style.borderColor = d.dbd; }
  });

  function onPos(lat, lon, speedKmh, hd, fromSim) {
    if (simTimer && !fromSim) return;
    const prev = me;
    me = { lat, lon, speed: speedKmh };
    if (hd != null && !isNaN(hd) && (speedKmh == null || speedKmh > 3)) heading = hd;
    else if (prev && distM(prev.lat, prev.lon, lat, lon) > 5) heading = bearing(prev.lat, prev.lon, lat, lon);
    const ll = new kakao.maps.LatLng(lat, lon);
    const firstFix = !meOv;
    if (!meOv) { const el = document.createElement('div'); el.className = 'mebus'; el.innerHTML = BUS_SVG; meOv = new kakao.maps.CustomOverlay({ map, position: ll, content: el, zIndex: 9 }); disp = { lat, lon }; }
    else glideTo(lat, lon);                     // 1초마다 뚝뚝 옮기지 않고 부드럽게 미끄러지듯 이동
    const dd = ((heading - curAng + 540) % 360) - 180; curAng += dd;   // 359°→1° 처럼 넘어가도 짧은 쪽으로만 회전
    const bel = meOv.getContent(); if (bel && bel.style) bel.style.transform = `rotate(${curAng}deg)`;
    if (follow) { map.setDraggable(false); followView(firstFix); }   // 내 위치가 잡히면 끌기 잠금(확대/축소는 가능)
    else applyRotate();
    update();
  }

  // 지도 전체를 CSS로 돌리고 밀어서(회전+이동) 움직임을 부드럽게 한다. 카카오 지도 중심은 많이 벗어날 때만 다시 잡는다.
  const LIMIT = 70;                       // 이만큼(px) 밀리면 지도 중심을 다시 잡음
  let panX = 0, panY = 0;
  function applyRotate() {
    $('map').style.transform = headUp ? `rotate(${-curAng}deg) translate(${-panX}px, ${-panY}px)` : '';
  }
  // 내 위치가 화면 가운데보다 아래(약 70% 지점)에 오도록, 가는 방향 앞쪽을 화면 중심으로 삼는다
  function followView(force) {
    if (!map || !me) return;
    const proj = map.getProjection(), m = $('map');
    const W = m.clientWidth, H = m.clientHeight;
    const bus = proj.containerPointFromCoords(new kakao.maps.LatLng(me.lat, me.lon));
    const off = $('view').clientHeight * 0.2, a = (headUp ? curAng : 0) * Math.PI / 180;
    const tx = bus.x + off * Math.sin(a), ty = bus.y - off * Math.cos(a);
    let dx = tx - W / 2, dy = ty - H / 2;
    if (force || Math.hypot(dx, dy) > LIMIT) {
      m.style.transition = 'none';
      map.setCenter(proj.coordsFromContainerPoint(new kakao.maps.Point(tx, ty)));
      panX = 0; panY = 0; applyRotate();
      void m.offsetWidth; m.style.transition = '';
      return;
    }
    panX = dx; panY = dy; applyRotate();
  }
  // 지도를 손으로 옮겨 보기 전에, 지금 화면에 보이는 자리를 카카오 지도 중심으로 확정
  function bakePan() {
    if (!map || (!panX && !panY)) return;
    const proj = map.getProjection(), m = $('map');
    m.style.transition = 'none';
    map.setCenter(proj.coordsFromContainerPoint(new kakao.maps.Point(m.clientWidth / 2 + panX, m.clientHeight / 2 + panY)));
    panX = 0; panY = 0;
  }
  // 지도 조각 크기: 어느 방향으로 돌려도 화면이 비지 않을 만큼만(정사각형) 만든다
  function sizeMap() {
    const v = $('view'), vw = v.clientWidth, vh = v.clientHeight;
    const S = Math.ceil(Math.hypot(vw, vh)) + 2 * LIMIT, m = $('map');
    m.style.width = S + 'px'; m.style.height = S + 'px';
    m.style.left = ((vw - S) / 2) + 'px'; m.style.top = ((vh - S) / 2) + 'px';
    if (map) { map.relayout(); if (follow && me) followView(true); }
  }
  window.addEventListener('resize', sizeMap);
  let curAng = 0, disp = null, glideRaf = null;
  function glideTo(lat, lon) {   // 표시 위치를 새 GPS 값까지 0.9초 동안 이동
    if (!disp) { disp = { lat, lon }; return; }
    if (glideRaf) cancelAnimationFrame(glideRaf);
    const from = { lat: disp.lat, lon: disp.lon }, t0 = performance.now();
    const step = (t) => {
      const f = Math.min(1, (t - t0) / 900);
      disp = { lat: from.lat + (lat - from.lat) * f, lon: from.lon + (lon - from.lon) * f };
      const ll = new kakao.maps.LatLng(disp.lat, disp.lon);
      if (meOv) meOv.setPosition(ll);
      glideRaf = f < 1 ? requestAnimationFrame(step) : null;
    };
    glideRaf = requestAnimationFrame(step);
  }

  function startGps() {
    if (SIM) { $('msg').textContent = '시험 모드: 지도를 누르면 그 곳이 내 위치가 됩니다.'; return; }
    if (!navigator.geolocation) { $('msg').textContent = '이 기기는 GPS를 지원하지 않습니다.'; return; }
    navigator.geolocation.watchPosition(
      p => onPos(p.coords.latitude, p.coords.longitude, p.coords.speed != null && p.coords.speed >= 0 ? Math.round(p.coords.speed * 3.6) : null, p.coords.heading),
      e => { $('nextDist').textContent = e.code === 1 ? '위치 권한을 허용해 주세요' : 'GPS 신호 찾는 중...'; },
      { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 });
  }

  // 평소에는 내 위치·진행 방향에 고정(끌기 잠금, 확대/축소만 가능). [지도 이동]을 누르면 잠시 자유롭게 끌어 볼 수 있고,
  // 다시 누르거나 손을 뗀 지 10초가 지나면 자동으로 내 위치로 돌아온다
  const PAN_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" style="vertical-align:-3px;margin-right:4px" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4"/></svg>';
  let panTimer = null;
  function setNav(on) {
    follow = on; headUp = on;
    if (panTimer) { clearTimeout(panTimer); panTimer = null; }
    $('btnPan').innerHTML = PAN_ICON + (on ? '지도 이동' : '내 위치로');
    $('btnPan').classList.toggle('on', !on);
    if (map) map.setDraggable(!(on && me));
    if (!on) { bakePan(); applyRotate(); void $('map').offsetWidth; $('map').style.transition = ''; }
    else if (me && map) followView(true);
    else applyRotate();
  }
  function panLater() { if (follow || editMode) return; if (panTimer) clearTimeout(panTimer); panTimer = setTimeout(() => setNav(true), 10000); }
  $('btnPan').onclick = () => { if (follow) { setNav(false); panLater(); } else setNav(true); };
  // ---- 모의주행: 노선선을 따라 가짜 GPS가 움직임 (책상에서 시험용) ----
  let simTimer = null, simDist = 0, simCum = null;
  function simBuild() {
    const P = route.pts; simCum = [0];
    for (let i = 1; i < P.length; i++) simCum.push(simCum[i - 1] + distM(P[i - 1][0], P[i - 1][1], P[i][0], P[i][1]));
  }
  function simPoint(d) {
    const P = route.pts; let i = 1;
    while (i < P.length - 1 && simCum[i] < d) i++;
    const seg = simCum[i] - simCum[i - 1] || 1, f = Math.min(1, Math.max(0, (d - simCum[i - 1]) / seg));
    return [P[i - 1][0] + (P[i][0] - P[i - 1][0]) * f, P[i - 1][1] + (P[i][1] - P[i - 1][1]) * f];
  }
  function simStop() { if (simTimer) clearInterval(simTimer); simTimer = null; $('btnSim').classList.remove('on'); $('btnSim').textContent = '▶ 모의주행'; }
  $('btnSim').onclick = () => {
    if (simTimer) { simStop(); return; }
    if (!route) return;
    simBuild(); if (simDist >= simCum[simCum.length - 1]) simDist = 0;
    $('btnSim').classList.add('on'); $('btnSim').textContent = '■ 멈춤';
    setNav(true);
    simTimer = setInterval(() => {
      const mult = +$('simSpeed').value;
      simDist += (40 / 3.6) * mult;
      if (simDist >= simCum[simCum.length - 1]) { simStop(); return; }
      const p = simPoint(simDist);
      onPos(p[0], p[1], 40, null, true);
    }, 1000);
  };
  $('route').onchange = () => { simStop(); simDist = 0; me = null; showRoute($('route').value); };

  loadKakao().then(() => {
    map = new kakao.maps.Map($('map'), { center: new kakao.maps.LatLng(37.4563, 126.7052), level: 5 });
    kakao.maps.event.addListener(map, 'dragend', panLater);
    kakao.maps.event.addListener(map, 'zoom_changed', () => { panLater(); if (follow && me) followView(true); });
    sizeMap();
    kakao.maps.event.addListener(map, 'click', (ev) => {
      const l = ev.latLng;
      if (simTimer && route) {   // 모의주행 중: 누른 곳에서 가장 가까운 정류장으로 건너뜀
        let bi = 0, bd = 1e12;
        route.stops.forEach((x, i) => { const d = distM(l.getLat(), l.getLng(), x[2], x[3]); if (d < bd) { bd = d; bi = i; } });
        simDist = simCum[route.stopAt[bi]]; route.prog = Math.max(0, bi - 1);
      } else if (SIM) onPos(l.getLat(), l.getLng(), 30, null);
    });
    showRoute($('route').value);
    startGps();
  }).catch(e => { $('msg').textContent = String(e.message || e); });
</script>
</body>
</html>
