<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>노선 링크 수정</title>
<style>
  body { font-family: -apple-system, 'Malgun Gothic', sans-serif; margin: 0 auto; padding: 16px; max-width: 1500px; box-sizing: border-box; background: #0f172a; color: #e2e8f0; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  input, select, button { font-size: 15px; padding: 9px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; width: 100%; box-sizing: border-box; margin-top: 8px; }
  button { background: #2563eb; border: 0; font-weight: 700; }
  button.sm { width: auto; padding: 4px 10px; margin: 0; font-size: 12px; background: #7f1d1d; }
  button.gray { background: #475569; } button.green { background: #16a34a; }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; }
  #msg { margin: 10px 0; font-size: 13px; color: #fbbf24; white-space: pre-wrap; }
  .box { background: #1e293b; border-radius: 10px; padding: 12px; margin-bottom: 12px; font-size: 13px; color: #94a3b8; }
  #list { max-height: 220px; overflow: auto; background: #1e293b; border-radius: 10px; }
  .it { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid #0f172a; font-size: 13px; cursor: pointer; }
  .it.sel { background: #1d4ed8; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .g { background: #16a34a; } .y { background: #eab308; } .r { background: #dc2626; } .n { background: #475569; } .a { background: #f97316; } .b { background: #64748b; }
  #map { width: 100%; height: 340px; border-radius: 10px; margin-top: 10px; background: #1e293b; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  td, th { padding: 4px 3px; border-bottom: 1px solid #1e293b; text-align: left; }
  td.r2 { text-align: right; white-space: nowrap; }
  .sub { color: #94a3b8; font-size: 12px; }

  #wrap { display: grid; grid-template-columns: 1fr 2fr; gap: 14px; align-items: start; margin-top: 10px; }
  #mapwrap { position: sticky; top: 8px; background: #0f172a; }
  #map { height: calc(100vh - 150px); min-height: 300px; margin-top: 0; }
  @media (max-width: 800px) { #wrap { grid-template-columns: 1fr; } #mapwrap { top: 0; z-index: 5; padding-bottom: 6px; } #map { height: 230px; min-height: 0; } }
  .blk { background: #1e293b; border-radius: 10px; margin: 10px 0; overflow: hidden; border: 2px solid transparent; }
  .blk.sel { border-color: #3b82f6; }
  .bh { display: flex; align-items: center; gap: 8px; padding: 9px 10px; font-size: 13px; cursor: pointer; background: #243247; }
  .btns { white-space: nowrap; text-align: right; } .btns button { width: auto; margin: 2px 0 2px 4px; padding: 5px 8px; font-size: 12px; }
  button.sm { background: #334155; } button.rm { background: #7f1d1d; } button.ad { background: #166534; }
</style>
</head>
<body>
<h1>🛠 노선 링크 수정 (시험)</h1>
<div class="box">
  노선의 구간을 출발지부터 돌아올 때까지 순서대로 보여 줍니다. 구간 제목을 누르면 위 지도에 그 구간 선만 나오고, 후보 링크가 아래에 나옵니다. 틀린 링크는 [빼기], 추천 링크는 [이 구간에 넣기], 맞는 게 없으면 [앞/뒤 구간 링크를 이 구간에 넣기]로 고칩니다. 고친 내용은 이 기기에 임시 저장되고, 끝나면 [최종 저장 파일 받기]로 받은 파일을 채팅에 올려 주세요. 앱 본 화면과 무관합니다.
  <input id="ik" placeholder="국토교통부 ITS 키 붙여넣기 (저장하지 않음)">
</div>
<div class="row">
  <select id="route"><option>282</option><option>281</option><option>221</option><option>206</option><option>205</option><option>204</option><option>203</option><option>203A</option><option>202</option><option>202A</option></select>
  <select id="flt"><option value="all">전체 구간</option><option value="nospd">속도 없는 구간만</option></select>
</div>
<button id="go">1. 노선 불러오고 소통정보 맞춰 보기</button>
<div id="msg"></div>
<div id="wrap">
  <div id="mapwrap"><div id="map"></div><div class="sub" id="info" style="margin:4px 0;"></div>
    <div class="row"><button id="reset" class="gray">선택한 구간 처음 상태로</button><button id="save" class="green">최종 저장 파일 받기</button></div></div>
  <div id="all"></div>
</div>
<script>
var KAKAO_JS_KEY = 'e5b58be31dc1470a91e6f354662a32e6';
var msg = document.getElementById('msg');
var S = { route: '', line: null, orig: null, segs: null, links: {}, area: null, traffic: null, itsNames: {}, cur: -1, map: null, layers: [], cand: {} };
var KX = Math.cos(37.5 * Math.PI / 180);

function loadKakao() {
  return new Promise(function (resolve, reject) {
    if (window.kakao && kakao.maps && kakao.maps.LatLng) return resolve();
    var s = document.createElement('script');
    s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + KAKAO_JS_KEY + '&autoload=false';
    s.onload = function () { kakao.maps.load(resolve); };
    s.onerror = function () { reject(new Error('카카오 지도를 불러오지 못했습니다')); };
    document.head.appendChild(s);
  });
}
function draftKey() { return 'yb_linkedit_' + S.route; }
function saveDraft() { try { localStorage.setItem(draftKey(), JSON.stringify(S.segs)); } catch (e) { } }
function info(id) { var a = S.area.links[id]; return a ? [a[0], a[1], a[2]] : (S.links[id] || [0, 0, '?']); }
function brg(a, b) { return Math.atan2((b[1] - a[1]) * 111320 * KX, (b[0] - a[0]) * 110540) * 180 / Math.PI; }
function turn(x, y) { var d = Math.abs(x - y) % 360; return Math.min(d, 360 - d); }

function flow(i) {
  var ids = S.segs[i], sumLen = 0, sumSp = 0, sumLim = 0, have = 0;
  ids.forEach(function (id) {
    var inf = info(id), t = S.traffic && S.traffic[id], sp = t ? parseFloat(t.speed) : NaN;
    if (!isNaN(sp) && inf[0] > 0) { var len = inf[1] || 1; sumLen += len; sumSp += sp * len; sumLim += inf[0] * len; have++; }
  });
  if (!S.traffic) return { cls: 'n', txt: '소통정보 없음', have: 0 };
  if (have) { var ratio = sumSp / sumLim; return { cls: ratio >= 0.8 ? 'g' : (ratio >= 0.4 ? 'y' : 'r'), txt: Math.round(sumSp / sumLen) + 'km · 제한 대비 ' + Math.round(ratio * 100) + '%', have: have }; }
  var nm = {}; ids.forEach(function (id) { var n = info(id)[2]; if (n && n !== '-') nm[n.replace(/번길.*$/, '').replace(/\s+/g, '')] = 1; });
  var names = Object.keys(nm), known = names.filter(function (n) { return S.itsNames[n]; });
  if (!names.length || known.length) return { cls: 'a', txt: '🅰 우리 쪽 확인 필요', have: 0 };
  return { cls: 'b', txt: '🅱 진짜 없음', have: 0 };
}
// 이 구간 노선선 근처(40m)에서 같은 방향(60도 안)으로 지나지만 아직 안 넣은 링크, 노선 순서대로
function candidates(i) {
  var seg = S.line.segs[i], inc = {}; S.segs[i].forEach(function (id) { inc[id] = 1; });
  var rows = [];
  Object.keys(S.area.links).forEach(function (id) {
    if (inc[id]) return;
    var pts = S.area.links[id][3], best = 1e9, at = 0;
    pts.forEach(function (p) { for (var j = 0; j < seg.length; j++) { var d = Math.hypot((p[0] - seg[j][0]) * 110540, (p[1] - seg[j][1]) * 111320 * KX); if (d < best) { best = d; at = j; } } });
    if (best > 40) return;
    var lb = brg(pts[0], pts[pts.length - 1]), sb = brg(seg[Math.min(at, seg.length - 2)], seg[Math.min(at + 1, seg.length - 1)]);
    if (turn(lb, sb) > 60) return;
    rows.push({ id: id, at: at, d: best });
  });
  rows.sort(function (a, b) { return a.at - b.at; });
  return rows;
}
function linkRow(i, id) {
  var inf = info(id), t = S.traffic && S.traffic[id];
  return '<tr><td>' + inf[2] + '<div class="sub">' + id + '</div></td><td class="r2">' + inf[0] + '</td><td class="r2">' + Math.round(inf[1]) + 'm</td><td class="r2">' + (t ? t.speed : '-') + '</td><td class="btns">'
    + '<button class="rm" data-op="del" data-i="' + i + '" data-id="' + id + '">빼기</button></td></tr>';
}
function renderAll() {
  var f = document.getElementById('flt').value, h = '';
  S.segs.forEach(function (ids, i) {
    var fl = flow(i);
    if (f === 'nospd' && fl.have && i !== S.cur) return;
    var nm = {}; ids.forEach(function (id) { var n = info(id)[2]; if (n && n !== '-') nm[n.replace(/번길.*$/, '')] = 1; });
    h += '<div class="blk' + (i === S.cur ? ' sel' : '') + '"><div class="bh" data-sel="' + i + '"><span class="dot ' + fl.cls + '"></span><b>' + (i + 1) + '번째</b><span>' + Object.keys(nm).slice(0, 3).join(', ') + '</span><span class="sub" style="margin-left:auto">링크 ' + ids.length + '개 · ' + fl.txt + '</span></div>';
    if (i === S.cur) h += '<div class="btns" style="padding:6px 10px;"><span class="sub">이 구간에 맞는 선택지가 없을 때:</span>'
      + (i > 0 ? '<button class="sm" data-op="copyprev" data-i="' + i + '">앞 구간 링크를 이 구간에 넣기</button>' : '')
      + (i < S.segs.length - 1 ? '<button class="sm" data-op="copynext" data-i="' + i + '">뒤 구간 링크를 이 구간에 넣기</button>' : '') + '</div>';
    h += '<table><tr><th>도로명</th><th>제한</th><th>길이</th><th>지금</th><th></th></tr>' + ids.map(function (id) { return linkRow(i, id); }).join('') + '</table>';
    if (i === S.cur) {
      var c = S.cand[i] = candidates(i);
      h += '<div class="sub" style="padding:6px 10px;">추천: 노선선 근처에 있지만 이 구간에 안 들어 있는 링크(같은 방향만, 노선 순서)</div><table>' + (c.length ? c.map(function (r) {
        var inf = info(r.id), t = S.traffic && S.traffic[r.id];
        return '<tr><td>' + inf[2] + '<div class="sub">' + r.id + ' · 선에서 ' + Math.round(r.d) + 'm</div></td><td class="r2">' + inf[0] + '</td><td class="r2">' + Math.round(inf[1]) + 'm</td><td class="r2">' + (t ? t.speed : '-') + '</td><td class="btns"><button class="ad" data-op="add" data-i="' + i + '" data-id="' + r.id + '">이 구간에 넣기</button></td></tr>';
      }).join('') : '<tr><td class="sub">없음</td></tr>') + '</table>';
    }
    h += '</div>';
  });
  var el = document.getElementById('all'); el.innerHTML = h || '<div class="box">해당하는 구간이 없습니다</div>';
  Array.prototype.forEach.call(el.querySelectorAll('[data-sel]'), function (d) { d.onclick = function () { select(parseInt(d.getAttribute('data-sel'), 10), false); }; });
  Array.prototype.forEach.call(el.querySelectorAll('button[data-op]'), function (b) { b.onclick = function () { op(b.getAttribute('data-op'), parseInt(b.getAttribute('data-i'), 10), b.getAttribute('data-id')); }; });
  document.getElementById('info').textContent = S.cur < 0 ? '' : (S.cur + 1) + '번째 구간 · ' + flow(S.cur).txt;
}
function op(kind, i, id) {
  var a = S.segs[i], k = a.indexOf(id);
  if (kind === 'add') { if (k < 0) a.push(id); }
  else if (kind === 'copyprev' || kind === 'copynext') {
    var from = S.segs[kind === 'copyprev' ? i - 1 : i + 1] || [];
    from.forEach(function (x) { if (a.indexOf(x) < 0) a.push(x); });
  }
  else if (k >= 0) a.splice(k, 1);
  saveDraft(); var y = window.scrollY; renderAll(); window.scrollTo(0, y); drawMap(false);
}
function drawMap(fit) {
  if (!S.map || S.cur < 0) return;
  S.layers.forEach(function (l) { l.setMap(null); }); S.layers = [];
  var seg = S.line.segs[S.cur], bounds = new kakao.maps.LatLngBounds();
  seg.forEach(function (p) { bounds.extend(new kakao.maps.LatLng(p[0], p[1])); });
  var LL = function (pts) { return pts.map(function (p) { return new kakao.maps.LatLng(p[0], p[1]); }); };
  (S.cand[S.cur] || []).forEach(function (r) {
    var pl = new kakao.maps.Polyline({ path: LL(S.area.links[r.id][3]), strokeWeight: 5, strokeColor: '#94a3b8', strokeOpacity: 0.6, map: S.map }); S.layers.push(pl);
  });
  S.segs[S.cur].forEach(function (id) {
    var g = S.area.links[id]; if (!g) return;
    var t = S.traffic && S.traffic[id];
    S.layers.push(new kakao.maps.Polyline({ path: LL(g[3]), strokeWeight: 7, strokeColor: t ? '#4ade80' : '#f97316', strokeOpacity: 0.9, map: S.map }));
  });
  S.layers.push(new kakao.maps.Polyline({ path: LL(seg), strokeWeight: 2, strokeColor: '#3b82f6', strokeOpacity: 1, map: S.map }));
  if (fit) S.map.setBounds(bounds);
}
function select(i, scroll) {
  S.cur = i; renderAll(); drawMap(true);
  if (scroll) { var el = document.querySelector('.blk.sel'); if (el) el.scrollIntoView({ block: 'start' }); }
}
async function fetchTraffic(key) {
  var p = S.line.segs.reduce(function (a, s) { return a.concat(s); }, []);
  var la = p.map(function (x) { return x[0]; }), lo = p.map(function (x) { return x[1]; }), H = 0.01;
  var url = 'https://openapi.its.go.kr:9443/trafficInfo?apiKey=' + encodeURIComponent(key) + '&type=all&getType=json'
    + '&minX=' + (Math.min.apply(null, lo) - H).toFixed(4) + '&maxX=' + (Math.max.apply(null, lo) + H).toFixed(4)
    + '&minY=' + (Math.min.apply(null, la) - H).toFixed(4) + '&maxY=' + (Math.max.apply(null, la) + H).toFixed(4);
  var ctl = new AbortController(), tm = setTimeout(function () { ctl.abort(); }, 25000);
  var t = await fetch(url, { signal: ctl.signal }).then(function (x) { return x.text(); });
  clearTimeout(tm);
  var items = (JSON.parse(t).body || {}).items || [], m = {}, nm = {};
  items.forEach(function (it) { if (it.linkId) m[String(it.linkId)] = it; if (it.roadName) nm[String(it.roadName).replace(/\s+/g, '')] = 1; });
  S.traffic = m; S.itsNames = nm;
  return items.length;
}
document.getElementById('go').onclick = async function () {
  S.route = document.getElementById('route').value; S.traffic = null; S.cur = -1; S.cand = {};
  msg.textContent = '노선 파일 불러오는 중...';
  try {
    var q = function (u) { return fetch(u, { cache: 'no-cache' }).then(function (x) { if (!x.ok) throw new Error(u + ' (' + x.status + ')'); return x.json(); }); };
    S.line = await q('data/route/' + S.route + '.json');
    var lk = await q('data/route/' + S.route + '_links.json');
    S.orig = lk.segs; S.links = lk.links || {};
    if (!S.area) { msg.textContent = '주변 도로 좌표 불러오는 중(1.1MB)...'; S.area = await q('data/route/area_links.json'); }
    S.segs = lk.segs.map(function (a) { return a.slice(); });
    var restored = false;
    try { var d = JSON.parse(localStorage.getItem(draftKey()) || 'null'); if (d && d.length === S.segs.length) { S.segs = d; restored = true; } } catch (e) { }
    try { await loadKakao(); if (!S.map) S.map = new kakao.maps.Map(document.getElementById('map'), { center: new kakao.maps.LatLng(37.49, 126.55), level: 5 }); }
    catch (e) { S.map = null; document.getElementById('mapwrap').style.display = 'none'; }
    var key = document.getElementById('ik').value.trim(), note = '';
    if (key) { msg.textContent = '소통정보 받는 중(노선 전체 범위, 1~2MB)...'; try { note = '소통정보 ' + (await fetchTraffic(key)) + '건 받음.'; } catch (e) { note = '소통정보 받기 실패: ' + e + ' (색 없이 링크만 볼 수 있습니다)'; } }
    else note = 'ITS 키가 비어 있어 소통정보 없이 링크만 보입니다.';
    msg.textContent = S.route + ' 노선 ' + S.segs.length + '개 구간. ' + note + (restored ? '\n이전에 고치던 내용을 불러왔습니다.' : '');
    renderAll();
    if (S.map) setTimeout(function () { S.map.relayout(); select(0, false); }, 200); else select(0, false);
  } catch (e) { msg.textContent = '실패: ' + (e && e.message || e); }
};
document.getElementById('flt').onchange = function () { if (S.segs) renderAll(); };
document.getElementById('reset').onclick = function () { if (!S.segs || S.cur < 0) return; S.segs[S.cur] = S.orig[S.cur].slice(); saveDraft(); renderAll(); drawMap(false); };
document.getElementById('save').onclick = function () {
  if (!S.segs) return;
  var links = {}; S.segs.forEach(function (a) { a.forEach(function (id) { links[id] = info(id); }); });
  var out = { v: 2, route: S.route, source: 'MOCT_LINK', edited: true, savedAt: Date.now(), segs: S.segs, links: links };
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out)], { type: 'application/json' }));
  a.download = S.route + '_links.json';
  document.body.appendChild(a); a.click(); a.remove();
  msg.textContent = '파일을 받았습니다(' + S.route + '_links.json). 이 파일을 채팅에 올려 주세요.';
};
</script>
</body>
</html>
