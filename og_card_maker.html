<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1200px;
      height: 630px;
      background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0f172a 75%, #020617 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Pretendard", sans-serif;
      overflow: hidden;
      position: relative;
    }
    /* 배경 은은한 빛 효과 */
    .glow-circle {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(234, 179, 8, 0.12) 0%, rgba(59, 130, 246, 0.08) 50%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    /* 영종운수 공식 웰컴 카드 (로그인 화면과 동일 디자인) */
    .brand-card {
      width: 1040px;
      height: 480px;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.98) 100%);
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: 36px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65), 0 0 40px rgba(234, 179, 8, 0.15), inset 0 2px 6px rgba(255, 255, 255, 0.2);
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 55px;
      padding: 0 60px;
      position: relative;
    }
    .logo-img {
      width: 180px;
      height: 180px;
      object-fit: contain;
      filter: drop-shadow(0 10px 25px rgba(234, 179, 8, 0.45));
    }
    .text-wrap {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .main-title {
      font-size: 68px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -1.5px;
      line-height: 1.15;
    }
    .highlight {
      color: #facc15;
      text-shadow: 0 4px 20px rgba(250, 204, 21, 0.35);
    }
    .sub-title {
      font-size: 26px;
      color: #94a3b8;
      font-weight: 800;
      letter-spacing: 2px;
      margin-top: 14px;
    }
    .badge-row {
      display: flex;
      gap: 14px;
      margin-top: 24px;
    }
    .badge {
      background: rgba(56, 189, 248, 0.12);
      border: 1.5px solid rgba(56, 189, 248, 0.35);
      color: #38bdf8;
      font-size: 19px;
      font-weight: 700;
      padding: 7px 18px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .badge-gold {
      background: rgba(234, 179, 8, 0.12);
      border: 1.5px solid rgba(234, 179, 8, 0.35);
      color: #facc15;
    }
  </style>
</head>
<body>
  <div class="glow-circle"></div>
  <div class="brand-card">
    <img src="yeongjong.png" class="logo-img" alt="영종운수 로고">
    <div class="text-wrap">
      <div class="main-title">
        영종운수 <span class="highlight">스마트근무표</span>
      </div>
      <div class="sub-title">
        YEONGJONG BUS DRIVER PORTAL
      </div>
      <div class="badge-row">
        <span class="badge badge-gold">✨ 실시간 승무 배차</span>
        <span class="badge">🎙️ Gemini AI 스마트 음성 비서</span>
      </div>
    </div>
  </div>
</body>
</html>
