<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>노선 시간 보기</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 12px 12px 40px; background: #0f172a; color: #e2e8f0; font-family: -apple-system, 'Malgun Gothic', sans-serif; font-size: 15px; }
  h1 { font-size: 18px; margin: 4px 0 10px; }
  select { font-size: 16px; padding: 8px; border-radius: 8px; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; }
  .sum { background: #1e293b; border-radius: 10px; padding: 10px 12px; margin: 10px 0; line-height: 1.6; }
  .sum b { color: #fde047; }
  .ok { color: #4ade80; } .bad { color: #f87171; }
  .upd { color: #94a3b8; font-size: 12px; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; }
  th { position: sticky; top: 0; background: #0f172a; text-align: right; color: #94a3b8; font-weight: 600; font-size: 12px; padding: 6px 4px; border-bottom: 1px solid #334155; }
  th:nth-child(2) { text-align: left; }
  td { padding: 7px 4px; border-bottom: 1px solid #1e293b; text-align: right; font-variant-numeric: tabular-nums; }
  td:nth-child(1) { color: #94a3b8; width: 34px; }
  td:nth-child(2) { text-align: left; word-break: keep-all; }
  td.cum { color: #94a3b8; font-size: 13px; }
  tr.anchor td { background: #3b1d1d; border-bottom-color: #7f1d1d; font-weight: 700; }
  tr.anchor td:nth-child(2)::before { content: '★ '; color: #f87171; }
  tr.short td.seg { color: #fde047; }
</style>
</head>
<body>
<h1>🕒 노선 시간 보기</h1>
<select id="route"></select>
<div class="sum" id="sum">불러오는 중...</div>
<table><thead><tr><th>순서</th><th>정류장</th><th>적용시간</th><th>누적</th></tr></thead><tbody id="rows"></tbody></table>
<script>
function fmt(sec) {
  sec = Math.round(sec); var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return (h ? h + '시간 ' : '') + (h || m ? m + '분 ' : '') + s + '초';
}
function cumFmt(sec) { sec = Math.round(sec); var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); }
var sel = document.getElementById('route'), lastSig = '';
function getJson(path) { return fetch(path + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }); }

function render(d) {
  var sig = JSON.stringify([d.stops.map(function (s) { return [s[1], s[4]]; }), d.incheonSec]);
  var rows = document.getElementById('rows');
  if (sig !== lastSig) {
    lastSig = sig;
    var h = '';
    d.stops.forEach(function (s, i) {
      var seg = i === 0 ? null : s[4] - d.stops[i - 1][4];
      var cls = (d.anchors.indexOf(i) >= 0 ? 'anchor ' : '') + (seg !== null && seg < 30 ? 'short' : '');
      h += '<tr class="' + cls + '"><td>' + (i + 1) + '</td><td>' + s[1] + '</td><td class="seg">' + (seg === null ? '-' : fmt(seg)) + '</td><td class="cum">' + cumFmt(s[4]) + '</td></tr>';
    });
    rows.innerHTML = h;
  }
  var diff = d.totalSec - d.incheonSec;
  document.getElementById('sum').innerHTML =
    '<b>' + d.route + '</b> · 정류장 ' + d.stops.length + '개 · 앵커(★) ' + d.anchors.length + '개<br>' +
    '노선 합계 <b>' + fmt(d.totalSec) + '</b> / 인가 ' + fmt(d.incheonSec) + ' ' +
    (diff === 0 ? '<span class="ok">(일치)</span>' : '<span class="bad">(' + (diff > 0 ? '+' : '-') + fmt(Math.abs(diff)) + ')</span>') +
    '<div class="upd">노란 글씨 = 30초 미만 구간 · 마지막 확인 ' + new Date().toLocaleTimeString('ko-KR') + ' (30초마다 자동 새로고침)</div>';
}

function load() {
  return getJson('data/routemaster/ganseon/' + encodeURIComponent(sel.value) + '.json').then(render)
    .catch(function (e) { document.getElementById('sum').textContent = '불러오지 못했습니다: ' + e.message; });
}
getJson('data/routemaster/ganseon/index.json').then(function (idx) {
  Object.keys(idx).forEach(function (n) { var o = document.createElement('option'); o.textContent = n; sel.appendChild(o); });
  var q = new URLSearchParams(location.search).get('route'); if (q && idx[q]) sel.value = q;
  load();
}).catch(function (e) { document.getElementById('sum').textContent = '불러오지 못했습니다: ' + e.message; });
sel.onchange = function () { lastSig = ''; load(); };
setInterval(function () { if (!document.hidden) load(); }, 30000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
</script>
</body>
</html>
