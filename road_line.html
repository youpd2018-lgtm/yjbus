<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>정류장 사이 도로명 뽑기</title>
<style>
  body { font-family: -apple-system, 'Malgun Gothic', sans-serif; margin: 0; padding: 16px; background: #0f172a; color: #e2e8f0; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  select, button { font-size: 16px; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; width: 100%; box-sizing: border-box; margin-top: 8px; }
  button { background: #2563eb; border: 0; font-weight: 700; }
  button.dl { background: #16a34a; }
  #msg { margin: 12px 0; font-size: 13px; color: #fbbf24; white-space: pre-wrap; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  td, th { padding: 5px 4px; border-bottom: 1px solid #1e293b; text-align: left; vertical-align: top; }
  td.n { text-align: right; white-space: nowrap; }
  tr.none td { color: #f87171; }
  tr.guess td.r { color: #fbbf24; }
  .sub { color: #94a3b8; }
  .box { background: #1e293b; border-radius: 10px; padding: 12px; margin-bottom: 12px; font-size: 13px; color: #94a3b8; }
</style>
</head>
<body>
<h1>🛣️ 정류장 사이 도로명 뽑기 (시험 페이지)</h1>
<div class="box">
  GitHub에 저장된 노선선(data/route/노선.json)에서 정류장과 정류장 사이 구간마다 길찾기 서버(OSRM, OpenStreetMap)에게 "이 선은 어떤 도로를 지나나요?"를 물어 도로명을 정리합니다. 앱 본 화면과 무관하고 아무것도 저장하지 않습니다.
</div>
<select id="route">
  <option>282</option><option>202</option><option>202A</option><option>203</option><option>203A</option>
  <option>204</option><option>205</option><option>206</option><option>221</option><option>281</option>
</select>
<button id="go">도로명 뽑기 시작</button>
<div id="msg"></div>
<button id="dl" class="dl" style="display:none;">📥 결과 파일 받기</button>
<div id="out"></div>
<script>
var msg = document.getElementById('msg'), out = document.getElementById('out'), result = null;
var OSRM = 'https://router.project-osrm.org/';

function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function distM(a, b) {
  var k = Math.cos(a[0] * Math.PI / 180);
  return Math.hypot((a[0] - b[0]) * 110540, (a[1] - b[1]) * 111320 * k);
}
// 점이 너무 많으면(서버 한도 100개) 균등하게 솎는다. 처음과 끝은 반드시 남긴다.
function thin(pts, max) {
  if (pts.length <= max) return pts;
  var out = [], step = (pts.length - 1) / (max - 1);
  for (var i = 0; i < max; i++) out.push(pts[Math.round(i * step)]);
  return out;
}
function coordStr(pts) { return pts.map(function (p) { return p[1].toFixed(5) + ',' + p[0].toFixed(5); }).join(';'); }

// 구간(점 목록)을 OSRM에 묻는다 → [{name, m}] (지나간 순서대로, 같은 이름은 합침)
async function roadsOfSeg(pts) {
  var P = thin(pts, 90);
  if (P.length < 2) return [];
  var steps = null;
  try {   // 1순위: 지도 맞추기(선을 따라 실제 도로에 붙여 줌)
    var rad = P.map(function () { return 30; }).join(';');
    var r = await fetch(OSRM + 'match/v1/driving/' + coordStr(P) + '?steps=true&geometries=geojson&overview=false&gaps=ignore&radiuses=' + rad).then(function (x) { return x.json(); });
    if (r && r.code === 'Ok' && r.matchings && r.matchings.length) {
      steps = [];
      r.matchings.forEach(function (m) { m.legs.forEach(function (l) { l.steps.forEach(function (s) { steps.push(s); }); }); });
    }
  } catch (e) { }
  if (!steps) {   // 2순위: 점 몇 개만 지나가는 길찾기
    try {
      var Q = thin(pts, 20);
      var r2 = await fetch(OSRM + 'route/v1/driving/' + coordStr(Q) + '?steps=true&overview=false').then(function (x) { return x.json(); });
      if (r2 && r2.code === 'Ok' && r2.routes && r2.routes.length) {
        steps = [];
        r2.routes[0].legs.forEach(function (l) { l.steps.forEach(function (s) { steps.push(s); }); });
      }
    } catch (e) { }
  }
  if (!steps) return null;
  var list = [];
  steps.forEach(function (s) {
    var nm = (s.name || '').trim() || (s.ref || '').trim();
    var m = Math.round(s.distance || 0);
    if (!nm) { nm = ''; }
    var last = list[list.length - 1];
    if (last && last.name === nm) last.m += m; else list.push({ name: nm, m: m });
  });
  return list;
}

document.getElementById('go').onclick = async function () {
  var route = document.getElementById('route').value;
  out.innerHTML = ''; document.getElementById('dl').style.display = 'none'; result = null;
  msg.textContent = '노선선 불러오는 중...';
  try {
    var line = await fetch('data/route/' + encodeURIComponent(route) + '.json', { cache: 'no-cache' }).then(function (x) { if (!x.ok) throw new Error('파일 없음 (HTTP ' + x.status + ')'); return x.json(); });
    var detail = [], failed = 0, noname = 0;
    for (var i = 0; i < line.segs.length; i++) {
      msg.textContent = '도로명 찾는 중... ' + (i + 1) + ' / ' + line.segs.length + ' 구간 (창을 닫지 마세요)';
      var list = await roadsOfSeg(line.segs[i]);
      if (list === null) { failed++; detail.push({ seg: i + 1, road: '', roads: [], failed: true }); }
      else {
        var byName = {};
        list.forEach(function (x) { if (x.name) byName[x.name] = (byName[x.name] || 0) + x.m; });
        var keys = Object.keys(byName).sort(function (a, b) { return byName[b] - byName[a]; });
        if (!keys.length) noname++;
        detail.push({ seg: i + 1, road: keys[0] || '', roads: keys.map(function (k) { return { name: k, m: byName[k] }; }), order: list.filter(function (x) { return x.name; }).map(function (x) { return x.name; }) });
      }
      await sleep(1100);   // 무료 서버라서 천천히 (초당 1회 안팎)
    }
    for (var q = 0; q < detail.length; q++) if (!detail[q].road && q > 0 && detail[q - 1].road) { detail[q].road = detail[q - 1].road; detail[q].guess = true; }
    result = { v: 1, route: route, source: 'osrm', savedAt: Date.now(), segRoads: detail.map(function (x) { return x.road; }), segDetail: detail };
    var h = '<table><tr><th>구간</th><th>도로명</th></tr>';
    detail.forEach(function (x) {
      var others = (x.roads || []).slice(1).map(function (r) { return r.name; });
      h += '<tr class="' + (x.road ? (x.guess ? 'guess' : '') : 'none') + '"><td class="n">' + x.seg + '번째</td><td class="r">' + (x.road || (x.failed ? '(서버 응답 없음)' : '(이름 없음)')) + (x.guess ? ' (앞 구간과 같다고 추정)' : '') + (others.length ? ' <span class="sub">외 ' + others.join(', ') + '</span>' : '') + '</td></tr>';
    });
    out.innerHTML = h + '</table>';
    var empty = detail.filter(function (x) { return !x.road; }).length;
    msg.textContent = route + ' 노선 ' + detail.length + '개 구간 조사 완료. 서버가 답하지 않은 구간 ' + failed + '개, 도로 이름이 없는 구간 ' + noname + '개 (비어 있으면 빨강, 앞 구간으로 이어 붙인 곳은 노랑). 한 구간에 이름이 여러 개면 가장 길게 지난 도로를 앞에 두고 나머지는 "외"로 표시했어요.';
    document.getElementById('dl').style.display = 'block';
  } catch (e) { msg.textContent = '실패: ' + (e && e.message || e); }
};

document.getElementById('dl').onclick = function () {
  if (!result) return;
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(result)], { type: 'application/json' }));
  a.download = 'roads_' + result.route + '.json';
  document.body.appendChild(a); a.click(); a.remove();
};
</script>
</body>
</html>
