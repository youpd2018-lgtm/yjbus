<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>영종운수 스마트근무표 시연</title>
<style>
  :root { --bg1:#0b1d2e; --bg2:#12344f; --acc:#fde047; --teal:#14b8a6; --ink:#e8f0f7; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body { font-family:'IBM Plex Sans KR','Malgun Gothic',sans-serif; color:var(--ink);
    background: radial-gradient(1200px 700px at 30% 20%, var(--bg2), var(--bg1)); overflow-x:hidden; }
  .wrap { min-height:100%; display:flex; align-items:center; justify-content:center; gap:48px; padding:20px 20px 90px; flex-wrap:wrap; }
  /* 스마트폰 틀 */
  .phone-box { width:calc(390px * var(--s,1) + 28px); height:calc(844px * var(--s,1) + 28px); flex:none; }
  .phone { width:418px; height:872px; padding:14px; border-radius:58px; background:#05080c;
    border:2px solid #2c3a48; box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 0 0 2px #0f151c;
    transform:scale(var(--s,1)); transform-origin:top left; position:relative; }
  .screen { width:390px; height:844px; border-radius:44px; overflow:hidden; background:#000; position:relative; }
  .screen iframe { width:390px; height:844px; border:0; display:block; }
  .cam { position:absolute; top:24px; left:50%; width:12px; height:12px; margin-left:-6px; border-radius:50%; background:#0b0f14; box-shadow:inset 0 0 0 2px #1b2530; z-index:3; pointer-events:none; }
  .title { font-size:56px; line-height:1.2; margin:0; max-width:420px; }
  .title b { color:var(--acc); }
  footer { position:fixed; left:0; right:0; bottom:0; padding:14px 16px; text-align:center; background:rgba(5,10,16,.85); font-size:17px; font-weight:700; letter-spacing:.2px; }
  footer a { color:var(--acc); text-decoration:none; }
  @media (max-width:760px) {
    .wrap { gap:16px; padding-top:10px; }
    .title { font-size:34px; text-align:center; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="title">스마트 근무표 <b>앱 시연</b></h1>
  <div class="phone-box" id="box">
    <div class="phone" id="phone">
      <div class="cam"></div>
      <div class="screen"><iframe id="app" title="영종운수 스마트근무표" src="index.html" allow="geolocation"></iframe></div>
    </div>
  </div>
</div>
<footer>제작 문의 · 영종운수 예비기사 유재필 · <a href="tel:01039725289">010-3972-5289</a></footer>
<script>
(function () {
  // 화면 크기에 맞게 폰 크기 줄이기
  function fit() {
    var narrow = window.innerWidth <= 760;
    var availH = window.innerHeight - 100, availW = window.innerWidth - 24;
    var s = Math.min(1, availH / 872, narrow ? availW / 418 : 1);
    document.documentElement.style.setProperty('--s', Math.max(0.4, s).toFixed(3));
  }
  fit(); window.addEventListener('resize', fit);
})();
</script>
</body>
</html>
