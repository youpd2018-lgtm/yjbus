<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>영종운수 스마트근무표 시연</title>
<style>
  :root { --bg1:#0b1d2e; --bg2:#12344f; --acc:#fde047; --teal:#14b8a6; --ink:#e8f0f7; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body { font-family:'IBM Plex Sans KR','Malgun Gothic',sans-serif; color:var(--ink);
    background: radial-gradient(1200px 700px at 30% 20%, var(--bg2), var(--bg1)); overflow-x:hidden; }
  .wrap { min-height:100%; display:flex; align-items:center; justify-content:center; gap:48px; padding:20px 20px 90px; flex-wrap:wrap; }
  /* 스마트폰 틀 */
  .phone-box { width:calc(390px * var(--s,1) + 28px); height:calc(844px * var(--s,1) + 28px); flex:none; }
  .phone { width:418px; height:872px; padding:14px; border-radius:58px; background:#05080c;
    border:2px solid #2c3a48; box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 0 0 2px #0f151c;
    transform:scale(var(--s,1)); transform-origin:top left; position:relative; }
  .screen { width:390px; height:844px; border-radius:44px; overflow:hidden; background:#000; position:relative; }
  .screen iframe { width:390px; height:844px; border:0; display:block; }
  .cam { position:absolute; top:24px; left:50%; width:12px; height:12px; margin-left:-6px; border-radius:50%; background:#0b0f14; box-shadow:inset 0 0 0 2px #1b2530; z-index:3; pointer-events:none; }
  .side { max-width:380px; }
  .side h1 { font-size:30px; margin:0 0 8px; line-height:1.25; }
  .side h1 b { color:var(--acc); }
  .side p { font-size:17px; line-height:1.6; color:#c5d6e6; margin:0 0 18px; }
  .btn { display:block; width:100%; font:inherit; font-weight:800; font-size:22px; padding:18px 20px; border-radius:16px; border:0; cursor:pointer; margin-bottom:12px; }
  .btn.go { background:linear-gradient(#fb923c,#ea580c); color:#fff; box-shadow:0 8px 24px rgba(234,88,12,.4); }
  .btn.sub { background:#1e3a52; color:#e8f0f7; font-size:17px; padding:13px; }
  .btn:disabled { opacity:.5; cursor:default; }
  .note { font-size:14px; color:#8fa7bd; margin-top:6px; }
  .menus { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 18px; }
  .menus span { background:#16324a; border-radius:999px; padding:6px 12px; font-size:14px; color:#cfe0f0; }
  footer { position:fixed; left:0; right:0; bottom:0; padding:14px 16px; text-align:center; background:rgba(5,10,16,.85); font-size:17px; font-weight:700; letter-spacing:.2px; }
  footer a { color:var(--acc); text-decoration:none; }
  @media (max-width:760px) {
    .wrap { gap:16px; padding-top:10px; }
    .side h1 { font-size:24px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="phone-box" id="box">
    <div class="phone" id="phone">
      <div class="cam"></div>
      <div class="screen"><iframe id="app" title="영종운수 스마트근무표" src="index.html?demo=1" allow="geolocation"></iframe></div>
    </div>
  </div>
  <div class="side">
    <h1><b>영종운수</b> 스마트근무표<br>시연 화면</h1>
    <p>가짜 로그인, 202번 1순번 실제 시간표, 가짜 GPS로 <b style="color:#fde047">5분 운행</b>을 보여 줍니다. 아래 버튼을 누른 뒤 화면 속 메뉴를 직접 눌러 보세요.</p>
    <button class="btn go" id="goBtn" disabled>▶ 모의주행 시작</button>
    <button class="btn sub" id="resetBtn">↺ 처음부터 다시</button>
    <div class="menus"><span>운행정보</span><span>근무정보</span><span>긴급전화</span><span>설정</span><span>LIVE</span><span>노선지도</span></div>
    <div class="note">※ 이 화면의 데이터는 시연용이며, 실제 기사님 정보는 사용하지 않습니다.</div>
  </div>
</div>
<footer>제작 문의 · 영종운수 예비기사 유재필 · <a href="tel:01039725289">010-3972-5289</a></footer>
<script>
(function () {
  var frame = document.getElementById('app'), go = document.getElementById('goBtn'), reset = document.getElementById('resetBtn');
  // 화면 크기에 맞게 폰 크기 줄이기
  function fit() {
    var narrow = window.innerWidth <= 760;
    var availH = window.innerHeight - 100, availW = window.innerWidth - 24;
    var s = Math.min(1, availH / 872, narrow ? availW / 418 : 1);
    document.documentElement.style.setProperty('--s', Math.max(0.4, s).toFixed(3));
  }
  fit(); window.addEventListener('resize', fit);
  function ready() { try { return frame.contentWindow && frame.contentWindow.__demo; } catch (e) { return null; } }
  frame.addEventListener('load', function () { go.disabled = !ready(); });
  go.addEventListener('click', function () {
    var w = frame.contentWindow, d = ready(); if (!d) return;
    d.start();
    try { if (typeof w.openLiveModal === 'function') w.openLiveModal(); } catch (e) { }
    go.textContent = '● 운행 중 (5배속)';
  });
  reset.addEventListener('click', function () {
    var d = ready(); if (d) d.reset();
    go.textContent = '▶ 모의주행 시작'; go.disabled = true;
    frame.src = 'index.html?demo=1&t=' + Date.now();
  });
})();
</script>
</body>
</html>
